<title>NotifyHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" id="themeColorMeta" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NotifyHub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<style>
/* ── Tokens ──────────────────────────────── */
:root{
  --bg:#111;--surf:#1c1c1c;--surf2:#272727;--bord:#2c2c2c;
  --fg:#f0f0f0;--muted:#888;--accent:#3b82f6;--abg:rgba(59,130,246,.12);
  --danger:#ef4444;--live:#22c55e;--warn:#f59e0b;
  color-scheme:dark;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f5f5f7;--surf:#fff;--surf2:#ebebeb;--bord:#e0e0e0;
  --fg:#111;--muted:#666;--accent:#2563eb;--abg:rgba(37,99,235,.1);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f5f5f7;--surf:#fff;--surf2:#ebebeb;--bord:#e0e0e0;
  --fg:#111;--muted:#666;--accent:#2563eb;--abg:rgba(37,99,235,.1);
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}

/* ── Reset ───────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;height:100dvh;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  height:100%;font-family:'Inter',system-ui,sans-serif;font-size:15px;
  background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;
  overflow:hidden;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img{display:block}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.nosel{user-select:none;-webkit-user-select:none}

/* ── App shell ───────────────────────────── */
.shell{display:flex;flex-direction:column;height:100%;position:relative}
@media(min-width:1200px){
  .shell{max-width:1200px;margin:0 auto;border-left:1px solid var(--bord);border-right:1px solid var(--bord)}
}

/* ── Header ──────────────────────────────── */
/* Band that paints behind the status bar */
body::before{
  content:'';position:fixed;inset:0 0 auto;
  height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50;
}
header{
  padding-left:max(14px,env(safe-area-inset-left,0px));
  padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
  min-height:calc(56px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:6px;
  background:var(--bg);border-bottom:1px solid var(--bord);
  flex-shrink:0;position:sticky;top:0;z-index:40;
}
.htitle{font-size:21px;font-weight:800;flex:1;letter-spacing:-.5px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex-shrink:0;transition:background .4s}
.sdot.live{background:var(--live)}
.hbtns{display:flex;gap:1px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);transition:background .1s,color .1s;flex-shrink:0}
.ib:active{background:var(--surf2)}
@media(hover:hover){.ib:hover{background:var(--surf2)}}
.ib.on{color:var(--accent)}

/* ── Search bar ──────────────────────────── */
.sbar{
  padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
  background:var(--bg);border-bottom:1px solid var(--bord);flex-shrink:0;
}
.sbar[hidden]{display:none!important}
.swrap{position:relative}
.swrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#si{width:100%;padding:10px 12px 10px 34px;background:var(--surf);border:none;
  border-radius:50px;color:var(--fg);font-size:15px;font-family:inherit;outline:none}
#si::placeholder{color:var(--muted)}

/* ── New banner ──────────────────────────── */
.nb{background:var(--accent);color:#fff;font-size:13px;font-weight:600;
  text-align:center;padding:9px;cursor:pointer;flex-shrink:0}
.nb[hidden]{display:none!important}

/* ── Body ────────────────────────────────── */
.body{flex:1;display:flex;min-height:0;overflow:hidden}

/* ── Sidebar (tablet ≥ 768px) ────────────── */
#sidebar{
  display:none;width:260px;flex-shrink:0;
  border-right:1px solid var(--bord);flex-direction:column;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
}
@media(min-width:768px){#sidebar{display:flex}}
.sb-sec{padding:12px 12px 8px;border-bottom:1px solid var(--bord)}
.sb-lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sb-tbtn{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:9px 10px;border-radius:10px;color:var(--muted);
  font-size:13px;font-weight:500;text-align:left;
  user-select:none;-webkit-user-select:none;transition:background .1s,color .1s;margin-bottom:2px
}
.sb-tbtn:active{background:var(--surf2)}
@media(hover:hover){.sb-tbtn:hover{background:var(--surf)}}
.sb-tbtn.on{background:var(--abg);color:var(--accent);font-weight:600}
.sb-tbtn svg{flex-shrink:0;opacity:.6}
.sb-tbtn.on svg{opacity:1}
.sb-app{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  transition:background .1s;margin-bottom:2px
}
.sb-app:active{background:var(--surf2)}
@media(hover:hover){.sb-app:hover{background:var(--surf)}}
.sb-app.on{background:var(--abg)}
.sb-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;position:relative;overflow:hidden}
.sb-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.sb-av.iv img{opacity:1}.sb-av.iv span{opacity:0}
.sb-av span{transition:opacity .2s;position:relative;z-index:1}
.sb-aname{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.sb-app.on .sb-aname{color:var(--accent);font-weight:600}
.sb-badge{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:50px;padding:1px 6px;min-width:18px;text-align:center}
.sb-badge:empty{display:none}

/* ── Feed ─────────────────────────────────── */
#feed{flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;min-width:0;
  padding-bottom:env(safe-area-inset-bottom,0px)}
@media(max-width:767px){
  #feed{padding-bottom:calc(60px + env(safe-area-inset-bottom,16px))}
}

/* ── Day separator ───────────────────────── */
.dsep{
  display:flex;align-items:center;gap:8px;
  padding:14px max(14px,env(safe-area-inset-right,0px)) 4px max(14px,env(safe-area-inset-left,0px));
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);cursor:pointer;user-select:none;-webkit-user-select:none;
}
.dsep::before,.dsep::after{content:'';flex:1;height:1px;background:var(--bord)}
.dsep-chev{transition:transform .18s;flex-shrink:0}
.dsep.col .dsep-chev{transform:rotate(-90deg)}
.ditems[hidden]{display:none!important}

/* ── Notification row ─────────────────────── */
.cr{
  display:flex;align-items:center;gap:12px;
  padding:11px max(14px,env(safe-area-inset-right,0px)) 11px max(14px,env(safe-area-inset-left,0px));
  min-height:68px;transition:background .08s;
  user-select:none;-webkit-user-select:none;position:relative;
}
.cr:active{background:var(--surf2)}
@media(hover:hover){.cr:hover{background:var(--surf)}}
#feed.sel .cr{cursor:pointer}
#feed.sel .cr.selected{background:var(--abg)}
#feed:not(.sel) .cck{display:none!important}
.cr.incoming{animation:slideIn .22s ease-out}
.cr.out{animation:slideOut .18s ease-in forwards;overflow:hidden;pointer-events:none}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(28px);max-height:0;padding:0}}
@media(prefers-reduced-motion:reduce){.cr.incoming,.cr.out{animation:none}}

/* ── Avatar ──────────────────────────────── */
.cav{width:52px;height:52px;border-radius:50%;position:relative;flex-shrink:0}
.cav-in{
  width:52px;height:52px;border-radius:50%;overflow:hidden;
  position:relative;display:grid;place-items:center;
}
.cai{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .22s;border-radius:50%}
.cav-in.iv .cai{opacity:1}.cav-in.iv .cal{opacity:0}
.cal{font-size:19px;font-weight:700;color:#fff;position:relative;z-index:1;pointer-events:none;transition:opacity .2s}
/* Notification image preview */
.cimg{display:block;margin-top:7px;max-width:220px;border-radius:10px;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.cimg img{display:block;width:100%;height:auto;max-height:220px;object-fit:cover}
.udot{position:absolute;bottom:1px;right:1px;width:14px;height:14px;border-radius:50%;
  background:var(--accent);border:2.5px solid var(--bg);display:none;z-index:3}
.cr.unread .udot{display:block}
.cck{position:absolute;inset:0;border-radius:50%;background:var(--accent);display:grid;
  place-items:center;z-index:4;opacity:0;transition:opacity .12s}
.cr.selected .cck{opacity:1}

/* ── Row content ─────────────────────────── */
.cmeta{flex:1;min-width:0}
.ctop{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.cname{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cr.unread .cname{font-weight:700}
.ctime{font-size:12px;color:var(--muted);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.cr.unread .ctime{color:var(--accent);font-weight:600}
.cbot{display:flex;align-items:center;gap:5px}
.cmsg{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;line-height:1.4}
.cr.unread .cmsg{color:var(--fg);font-weight:500}
.cudot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;display:none}
.cr.unread .cudot{display:block}
/* Typed-text rows */
.ttag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--accent);background:var(--abg);padding:1px 5px;border-radius:5px;margin-left:6px;vertical-align:middle}
.cr.typed .cmsg{font-style:italic}
.cr.typed .cav-in{box-shadow:inset 0 0 0 2px var(--abg)}
/* Quick actions */
.cacts{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity .12s}
@media(hover:hover){.cr:hover .cacts{opacity:1}}
@media(hover:none){.cacts{opacity:1}}
#feed.sel .cacts{display:none!important}
.ca{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);transition:background .1s,color .1s;touch-action:manipulation}
.ca:active{background:var(--surf2)}
@media(hover:hover){.ca:hover{background:var(--surf2);color:var(--fg)} .ca.del:hover{color:var(--danger)}}

/* ── Skeleton ──────────────────────────────── */
.skelwrap{padding:6px 0}
.skelrow{display:flex;align-items:center;gap:12px;
  padding:11px max(14px,env(safe-area-inset-right,0px)) 11px max(14px,env(safe-area-inset-left,0px));min-height:68px}
.skelav{width:52px;height:52px;border-radius:50%;background:var(--surf);animation:blink 1.6s infinite;flex-shrink:0}
.skelbody{flex:1;display:flex;flex-direction:column;gap:7px}
.skelln{height:12px;border-radius:6px;background:var(--surf);animation:blink 1.6s infinite}
.skelln.w80{width:80%}.skelln.w55{width:55%}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:.8}}

/* ── Empty ─────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;padding:72px 24px;
  text-align:center;color:var(--muted);gap:10px}
.empty svg{opacity:.2}
.empty p{font-size:15px}

/* ── Load more ─────────────────────────────── */
.lmwrap{padding:8px 14px 32px}
.lmbtn{width:100%;padding:12px;background:none;border:1.5px solid var(--bord);
  border-radius:12px;color:var(--muted);font-size:13px;font-family:inherit;
  touch-action:manipulation;transition:background .1s}
.lmbtn:active{background:var(--surf)}.lmbtn:disabled{opacity:.4;cursor:default}

/* ── Bottom navigation (mobile only) ─────────── */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(56px + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);border-top:1px solid var(--bord);
  display:flex;align-items:center;z-index:30;
}
@media(min-width:768px){.bnav{display:none}}
@media(min-width:1200px){
  .bnav{max-width:1200px;left:50%;transform:translateX(-50%)}
}
.bntab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:5px 4px;color:var(--muted);position:relative;
  font-size:11px;font-weight:500;min-height:56px;transition:color .15s;
}
.bntab:active{background:var(--surf2)}
.bntab.on{color:var(--accent)}
.bntab.on::before{
  content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);
  width:52px;height:26px;background:var(--abg);border-radius:13px;z-index:-1;
}
.bntab-pill{
  position:absolute;top:4px;right:calc(50% - 22px);
  min-width:16px;height:16px;border-radius:8px;padding:0 4px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.bntab-pill:empty{display:none}

/* ── Select bar ─────────────────────────────── */
.selbar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);border-top:1px solid var(--bord);
  display:flex;align-items:center;gap:8px;
  padding:10px max(14px,env(safe-area-inset-right,0px))
           max(calc(60px + env(safe-area-inset-bottom,10px)),18px)
           max(14px,env(safe-area-inset-left,0px));
  z-index:35;transform:translateY(110%);transition:transform .22s cubic-bezier(.4,0,.2,1);
}
@media(min-width:768px){
  .selbar{left:260px;padding-bottom:max(13px,env(safe-area-inset-bottom,0px))}
}
@media(min-width:1200px){
  .selbar{max-width:calc(1200px - 260px);left:50%;right:auto;transform:translateX(-50%) translateY(110%)}
  .selbar.show{transform:translateX(-50%)}
}
.selbar.show{transform:none}
.sbc{padding:9px 15px;border-radius:50px;background:var(--surf);color:var(--muted);font-size:14px;font-weight:500;touch-action:manipulation}
.sbi{flex:1;font-size:13px;color:var(--muted);text-align:center}
.sball{padding:9px 15px;border-radius:50px;color:var(--accent);font-size:14px;font-weight:600;touch-action:manipulation}
.sbdel{padding:9px 18px;border-radius:50px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;touch-action:manipulation}
.sbdel:disabled{opacity:.38}

/* ── Bottom sheet (mobile filter) ────────────── */
.sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:59;display:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet-ov.open{display:block}
@media(min-width:768px){.sheet-ov,.sheet{display:none!important}}
.sheet{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);border-top:1.5px solid var(--bord);border-radius:20px 20px 0 0;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:60;display:flex;flex-direction:column;
  max-height:85dvh;padding-bottom:env(safe-area-inset-bottom,0px);
}
.sheet.open{transform:none}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--bord);margin:12px auto 0;flex-shrink:0}
.sheet-head{display:flex;align-items:center;padding:12px 16px 8px;flex-shrink:0}
.sheet-title{font-size:16px;font-weight:700;flex:1}
.sheet-body{overflow-y:auto;flex:1;padding-bottom:12px}
.sheet-sec{padding:12px 16px;border-bottom:1px solid var(--bord)}
.sheet-sec:last-child{border-bottom:none}
.sheet-stitle{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sheet-tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stb{padding:10px 12px;border-radius:12px;border:1.5px solid var(--bord);color:var(--muted);
  font-size:13px;font-weight:500;text-align:left;touch-action:manipulation;
  transition:background .1s,color .1s,border-color .1s}
.stb.on{background:var(--abg);border-color:var(--accent);color:var(--accent);font-weight:600}
.sapp{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;
  cursor:pointer;margin-bottom:2px;touch-action:manipulation;transition:background .1s}
.sapp:active{background:var(--surf2)}.sapp.on{background:var(--abg)}
.sav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;position:relative;overflow:hidden}
.sav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.sav.iv img{opacity:1}.sav.iv span{opacity:0}
.sav span{transition:opacity .2s;position:relative;z-index:1}
.savn{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savb{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:50px;padding:1px 6px}
.savb:empty{display:none}

/* ── Tablet drawer ────────────────────────────── */
.drov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:59;display:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.drov.open{display:block}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(280px,88vw);
  background:var(--bg);border-left:1px solid var(--bord);
  transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  z-index:60;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
.drawer.open{transform:none}
.drhead{display:flex;align-items:center;padding:13px 12px 13px 14px;border-bottom:1px solid var(--bord);flex-shrink:0}
.drtitle{font-size:16px;font-weight:700;flex:1}
.drbody{overflow-y:auto;flex:1;padding:0 0 max(24px,env(safe-area-inset-bottom,0px))}
.drsec{padding:12px 14px;border-bottom:1px solid var(--bord)}
.drstitle{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.drtgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.dtb{padding:9px 10px;border-radius:11px;border:1.5px solid var(--bord);color:var(--muted);
  font-size:13px;font-weight:500;text-align:left;touch-action:manipulation;
  transition:background .1s,color .1s,border-color .1s}
.dtb.on{background:var(--abg);border-color:var(--accent);color:var(--accent);font-weight:600}
.dapp{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
  cursor:pointer;touch-action:manipulation;margin-bottom:2px;transition:background .1s}
.dapp:active{background:var(--surf2)}
@media(hover:hover){.dapp:hover{background:var(--surf)}}
.dapp.on{background:var(--abg)}
.dav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;position:relative;overflow:hidden}
.dav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.dav.iv img{opacity:1}.dav.iv span{opacity:0}
.dav span{transition:opacity .2s;position:relative;z-index:1}
.davn{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.davb{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:50px;padding:1px 6px}
.davb:empty{display:none}

/* ── Modal ─────────────────────────────────── */
.mlov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;
  z-index:80;padding:24px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.mlov[hidden]{display:none!important}
.mlbox{background:var(--bg);border:1px solid var(--bord);border-radius:20px;
  padding:28px 20px 20px;max-width:270px;width:100%;text-align:center;animation:popIn .16s ease-out}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.mlico{font-size:34px;margin-bottom:10px}
.mlh{font-size:17px;font-weight:700;margin-bottom:5px}
.mls{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.mlbtns{display:flex;gap:8px}
.mlcan{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;
  background:var(--surf);color:var(--fg);border:1px solid var(--bord);touch-action:manipulation}
.mlcon{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;
  background:var(--accent);color:#fff;border:none;touch-action:manipulation}

<script>
const SERVER='https://notificationhub-10g2.onrender.com'
const token='solaimankabiranik'
const hdrs=()=>({'Authorization':`Bearer ${token}`,'Content-Type':'application/json'})

fetch(`${SERVER}/health`,{cache:'no-store'}).catch(()=>{})
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{})

// ── Domain map ────────────────────────────────
const DOMAIN_MAP={
  'com.google.android.gm':'gmail.com','com.google.android.youtube':'youtube.com',
  'com.google.android.apps.messaging':'messages.google.com','com.google.android.apps.maps':'maps.google.com',
  'com.google.android.calendar':'calendar.google.com','com.google.android.keep':'keep.google.com',
  'com.google.android.apps.docs':'docs.google.com','com.google.android.apps.photos':'photos.google.com',
  'com.google.android.apps.translate':'translate.google.com','com.google.android.apps.youtube.music':'music.youtube.com',
  'com.google.android.gms':'google.com','com.google.android.googlequicksearchbox':'google.com',
  'com.google.android.dialer':'google.com','com.facebook.orca':'messenger.com',
  'com.facebook.katana':'facebook.com','com.instagram.android':'instagram.com',
  'com.whatsapp':'whatsapp.com','com.whatsapp.w4b':'whatsapp.com',
  'com.twitter.android':'x.com','com.x.android':'x.com',
  'org.telegram.messenger':'telegram.org','org.telegram.plus':'telegram.org',
  'org.thunderdog.challegram':'telegram.org','com.snapchat.android':'snapchat.com',
  'com.zhiliaoapp.musically':'tiktok.com','com.linkedin.android':'linkedin.com',
  'com.reddit.frontpage':'reddit.com','com.discord':'discord.com',
  'com.Slack':'slack.com','com.microsoft.teams':'teams.microsoft.com',
  'us.zoom.videomeetings':'zoom.us','com.spotify.music':'spotify.com',
  'com.netflix.mediaclient':'netflix.com','com.amazon.mShop.android.shopping':'amazon.com',
  'com.bkash.business':'bkash.com','com.nagad.app':'nagad.com.bd',
  'com.dbbl.mobilebanking':'dutchbanglabank.com','com.bracbank.astha':'bracbank.com',
  'com.pathao.user':'pathao.com','com.shohoz.android':'shohoz.com',
  'com.ubercab':'uber.com','com.daraz.android':'daraz.com.bd',
  'com.chaldal.android':'chaldal.com','com.duolingo':'duolingo.com',
  'com.paypal.android.p2pmobile':'paypal.com','com.microsoft.office.outlook':'outlook.com',
}

function iconSrcs(pkg){
  let d=DOMAIN_MAP[pkg]
  if(!d){const p=pkg.split('.');if(p.length>=2&&['com','org','net','io','app','co'].includes(p[0]))d=p[1]+'.com';else return[]}
  const b=d.split('/')[0]
  return[`https://logo.clearbit.com/${b}`,`https://www.google.com/s2/favicons?domain=${d}&sz=128`]
}
function tryNextIcon(el){
  try{const srcs=JSON.parse(el.dataset.srcs||'[]'),si=parseInt(el.dataset.si||'0')+1;el.dataset.si=si;if(si<srcs.length){const img=el.querySelector('.cai,.sb-av img,[class*=img]');if(img) img.src=srcs[si]}}catch{}
}

// ── Utils ─────────────────────────────────────
const PAL=['#1877f2','#e91e63','#9c27b0','#00897b','#e65100','#1565c0','#2e7d32','#6a1b9a','#c62828','#37474f']
function appColor(p){let h=0;for(let i=0;i<p.length;i++)h=((h<<5)-h+p.charCodeAt(i))|0;return PAL[Math.abs(h)%PAL.length]}
function appInit(l){return(l||'?').trim()[0].toUpperCase()}
function relTime(iso){const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function imgUrl(u){return !u?'' : (u.startsWith('http')?u:`${SERVER}${u}?token=${encodeURIComponent(token)}`)}

// ── Item normalisation ─────────────────────────
function normNotif(n){return{_kind:'n',_uid:'n'+n.id,...n}}
function normText(t){return{_kind:'t',_uid:'t'+t.id,id:t.id,package_name:t.package_name,app_label:t.app_label,title:null,text_body:t.text,received_at:t.received_at,captured_at:t.captured_at,is_read:true}}
function sortItems(){notifs.sort((a,b)=>new Date(b.received_at||b.posted_at)-new Date(a.received_at||a.posted_at))}

// ── State ─────────────────────────────────────
let notifs=[],appFilter=null,searchQ='',timeFilter='all',unreadOnly=false
let page=1,totalCount=0,hasMore=false,newPending=0
let appCounts={},selectMode=false,selectedIds=new Set()
let currentGroups=[],userToggledDays=new Set()
let activeTab='all'

// ── Bottom nav tab switch ──────────────────────
function switchTab(tab){
  if(tab==='apps'||tab==='filter'){openSheet();return}
  activeTab=tab
  document.querySelectorAll('.bntab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab))
  if(tab==='all'){unreadOnly=false;renderFeed()}
  if(tab==='unread'){unreadOnly=true;renderFeed()}
}

// ── Sheet (mobile filter) ──────────────────────
function openSheet(){document.getElementById('sheet').classList.add('open');document.getElementById('sheetOv').classList.add('open')}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('sheetOv').classList.remove('open')}

// ── Drawer ────────────────────────────────────
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('drov').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drov').classList.remove('open')}

// ── Filters ───────────────────────────────────
function setTime(t){
  timeFilter=t
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))
  renderFeed()
}
function filteredNotifs(){
  const now=Date.now(),todayMs=new Date().setHours(0,0,0,0)
  return notifs.filter(n=>{
    if(unreadOnly&&(n._kind!=='n'||n.is_read))return false
    if(appFilter&&n.package_name!==appFilter) return false
    if(searchQ){const q=searchQ.toLowerCase();if(!(n.title||'').toLowerCase().includes(q)&&!(n.text_body||'').toLowerCase().includes(q)&&!(n.app_label||'').toLowerCase().includes(q)) return false}
    const t=new Date(n.received_at||n.posted_at).getTime()
    if(timeFilter==='today') return t>=todayMs
    if(timeFilter==='earlier') return t<todayMs
    const h=parseInt(timeFilter);if(!isNaN(h)) return now-t<=h*3600000
    return true
  })
}

// ── Day grouping ──────────────────────────────
function groupByDay(list){
  const map=new Map(),now=new Date(),tod=new Date(now);tod.setHours(0,0,0,0);const yes=new Date(tod);yes.setDate(yes.getDate()-1)
  for(const n of list){const d=new Date(n.received_at||n.posted_at),ds=new Date(d);ds.setHours(0,0,0,0);const tk=ds.getTime();const lbl=tk===tod.getTime()?'Today':tk===yes.getTime()?'Yesterday':d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});if(!map.has(lbl))map.set(lbl,{lbl,tk,items:[]});map.get(lbl).items.push(n)}
  return[...map.values()].sort((a,b)=>b.tk-a.tk)
}
function isDayCol(lbl){const def=lbl!=='Today'&&lbl!=='Yesterday';return userToggledDays.has(lbl)?!def:def}
function toggleDay(idx){
  const g=currentGroups[idx];if(!g) return
  userToggledDays.has(g.lbl)?userToggledDays.delete(g.lbl):userToggledDays.add(g.lbl)
  const hdr=document.querySelector(`.dsep[data-i="${idx}"]`),items=document.querySelector(`.ditems[data-i="${idx}"]`)
  if(hdr&&items){const col=isDayCol(g.lbl);hdr.classList.toggle('col',col);items.hidden=col}
}

// ── Build row ─────────────────────────────────
const CHK=`<svg width="15" height="15" viewBox="0 0 16 16" fill="white"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg>`

function buildRow(n){
  const sel=selectedIds.has(n._uid)
  const isText=n._kind==='t'
  const unread=!isText&&!n.is_read
  const app=esc(n.app_label||n.package_name.split('.').pop())
  const preview=isText
    ? esc(n.text_body||'')
    : esc(n.title&&n.text_body?`${n.title}: ${n.text_body}`:(n.title||n.text_body||'No preview'))
  const srcs=iconSrcs(n.package_name),color=appColor(n.package_name),letter=appInit(n.app_label||n.package_name)
  const enc=srcs.length?` data-srcs="${esc(JSON.stringify(srcs))}" data-si="0"`:''
  const img=srcs.length?`<img class="cai" src="${esc(srcs[0])}" loading="lazy" onload="this.parentElement.classList.add('iv')" onerror="tryNextIcon(this.parentElement)" alt="">`:''
  const tag=isText?'<span class="ttag">typed</span>':''
  const body=isText?`"${preview}"`:preview
  const thumb=!isText&&n.image_url?`<a class="cimg" href="${esc(imgUrl(n.image_url))}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><img src="${esc(imgUrl(n.image_url))}" loading="lazy" alt=""></a>`:''
  const delFn=isText?`doDeleteText('${n._uid}')`:`doArchive('${n._uid}')`
  return`<div class="cr${unread?' unread':''}${sel?' selected':''}${isText?' typed':''}" data-id="${n._uid}" onclick="onRowClick('${n._uid}')">
    <div class="cav"><div class="cav-in" style="background:${color}"${enc}>${img}<span class="cal">${letter}</span></div><div class="udot"></div><div class="cck">${CHK}</div></div>
    <div class="cmeta">
      <div class="ctop"><span class="cname">${app}${tag}</span><span class="ctime" data-ts="${esc(n.received_at||n.posted_at)}">${relTime(n.received_at||n.posted_at)}</span></div>
      <div class="cbot"><span class="cmsg">${body}</span><span class="cudot"></span></div>
      ${thumb}
    </div>
    <div class="cacts">
      ${unread?`<button class="ca nosel" onclick="event.stopPropagation();doRead('${n._uid}',this)" title="Read"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg></button>`:''}
      <button class="ca del nosel" onclick="event.stopPropagation();${delFn}" title="${isText?'Delete':'Archive'}"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"/></svg></button>
      ${!isText?`<button class="ca del nosel" onclick="event.stopPropagation();doDeletePerm('${n._uid}')" title="Delete permanently"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M6.5 1a.5.5 0 00-.5.5V2H3.5a.5.5 0 000 1h.6l.7 10.2a1 1 0 001 .8h4.4a1 1 0 001-.8L12.9 3h.6a.5.5 0 000-1H10V1.5a.5.5 0 00-.5-.5h-3zM5.13 3h5.74l-.68 9.7a.1.1 0 01-.1.08H5.91a.1.1 0 01-.1-.08L5.13 3z"/></svg></button>`:''}
    </div>
  </div>`
}

// ── Render feed ───────────────────────────────
function renderFeed(){
  const feed=document.getElementById('feed'),vis=filteredNotifs()
  if(!vis.length){
    const msg=unreadOnly?'No unread notifications':notifs.length?'No results':'No notifications yet'
    feed.innerHTML=`<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg><p>${msg}</p></div>`;return
  }
  currentGroups=groupByDay(vis)
  const CHEV=`<svg class="dsep-chev" width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M4.427 7.427l3.396 3.396a.25.25 0 00.354 0l3.396-3.396A.25.25 0 0011.396 7H4.604a.25.25 0 00-.177.427z"/></svg>`
  let html=''
  for(let i=0;i<currentGroups.length;i++){const g=currentGroups[i],col=isDayCol(g.lbl);html+=`<div><div class="dsep nosel${col?' col':''}" data-i="${i}" onclick="toggleDay(${i})">${esc(g.lbl)}<span style="font-weight:400;font-size:10px;margin-left:4px;opacity:.7">${g.items.length}</span>${CHEV}</div><div class="ditems" data-i="${i}"${col?' hidden':''}>${g.items.map(buildRow).join('')}</div></div>`}
  if(hasMore) html+=`<div class="lmwrap"><button class="lmbtn" id="lmbtn" onclick="loadMore()">Load older</button></div>`
  feed.innerHTML=html;updateSelUI()
}

// ── App lists (sidebar + drawer + sheet) ──────
function iconImg(pkg,lbl,cls){
  const srcs=iconSrcs(pkg),color=appColor(pkg),letter=appInit(lbl||pkg)
  const enc=srcs.length?` data-srcs="${esc(JSON.stringify(srcs))}" data-si="0"`:''
  const img=srcs.length?`<img src="${esc(srcs[0])}" loading="lazy" onload="this.parentElement.classList.add('iv')" onerror="tryNextIcon(this.parentElement)" alt="">`:''
  return`<div class="${cls}" style="background:${color}"${enc}>${img}<span>${letter}</span></div>`
}

function renderAppLists(){
  const apps=Object.entries(appCounts).sort((a,b)=>b[1].total-a[1].total)
  const totalUnread=apps.reduce((s,[,v])=>s+v.unread,0)
  // Update unread badge on bottom nav
  const badge=document.getElementById('unreadBadge')
  if(badge) badge.textContent=totalUnread>0?(totalUnread>99?'99+':totalUnread):''

  const on=appFilter===null
  let sh=`<div class="sapp${on?' on':''}" onclick="setApp(null);closeSheet()"><div class="sav" style="background:var(--accent)"><span>✦</span></div><span class="savn">All apps</span>${totalUnread?`<span class="savb">${totalUnread}</span>`:''}</div>`
  let dr=`<div class="dapp${on?' on':''}" onclick="setApp(null)"><div class="dav" style="background:var(--accent)"><span>✦</span></div><span class="davn">All apps</span>${totalUnread?`<span class="davb">${totalUnread}</span>`:''}</div>`
  let sb=`<div class="sb-app${on?' on':''} nosel" onclick="setApp(null)"><div class="sb-av" style="background:var(--accent)"><span>✦</span></div><span class="sb-aname">All apps</span>${totalUnread?`<span class="sb-badge">${totalUnread}</span>`:''}</div>`

  for(const[pkg,c]of apps){
    const lbl=c.label||pkg.split('.').pop(),isOn=appFilter===pkg,pj=JSON.stringify(pkg)
    sh+=`<div class="sapp${isOn?' on':''}" onclick="setApp(${pj});closeSheet()">${iconImg(pkg,lbl,'sav')}<span class="savn">${esc(lbl)}</span>${c.unread?`<span class="savb">${c.unread}</span>`:''}</div>`
    dr+=`<div class="dapp${isOn?' on':''}" onclick="setApp(${pj})">${iconImg(pkg,lbl,'dav')}<span class="davn">${esc(lbl)}</span>${c.unread?`<span class="davb">${c.unread}</span>`:''}</div>`
    sb+=`<div class="sb-app${isOn?' on':''} nosel" onclick="setApp(${pj})">${iconImg(pkg,lbl,'sb-av')}<span class="sb-aname">${esc(lbl)}</span>${c.unread?`<span class="sb-badge">${c.unread}</span>`:''}</div>`
  }
  const sa=document.getElementById('sheetApps'),da=document.getElementById('drawerApps'),sba=document.getElementById('sidebarApps')
  if(sa) sa.innerHTML=sh;if(da) da.innerHTML=dr;if(sba) sba.innerHTML=sb
}

// ── App counts ────────────────────────────────
function rebuildAppCounts(){
  appCounts={}
  for(const it of notifs){
    if(!appCounts[it.package_name])appCounts[it.package_name]={total:0,unread:0,label:it.app_label}
    appCounts[it.package_name].total++
    if(it._kind==='n'&&!it.is_read)appCounts[it.package_name].unread++
  }
}

// ── Load ──────────────────────────────────────
async function load(reset=false){
  if(reset){page=1;notifs=[]}
  const p=new URLSearchParams({page,limit:50})
  if(appFilter) p.set('package',appFilter)
  if(searchQ)   p.set('search',searchQ)
  try{
    const res=await fetch(`${SERVER}/api/notifications?${p}`,{headers:hdrs()})
    if(res.status===401){location.reload();return}
    const json=await res.json(),rows=(json.data||[]).map(normNotif)
    if(reset){
      notifs=rows
      try{
        const tp=new URLSearchParams({limit:200})
        if(appFilter) tp.set('package',appFilter)
        if(searchQ)   tp.set('search',searchQ)
        const tr=await fetch(`${SERVER}/api/typed-text?${tp}`,{headers:hdrs()})
        if(tr.ok){const tj=await tr.json();notifs=notifs.concat((tj.data||[]).map(normText))}
      }catch{}
      sortItems();rebuildAppCounts()
    } else notifs=[...notifs,...rows]
    totalCount=json.pagination?.total??notifs.length;hasMore=json.pagination?.hasMore??false
    renderAppLists();renderFeed()
  }catch{document.getElementById('feed').innerHTML=`<div class="empty"><p style="color:var(--danger)">Could not load</p></div>`}
}
async function loadMore(){const btn=document.getElementById('lmbtn');if(btn)btn.disabled=true;page++;await load(false)}
function doRefresh(){
  const btn=document.getElementById('refreshBtn')
  btn.style.animation='spin .6s ease-in-out'
  btn.addEventListener('animationend',()=>btn.style.animation='',{once:true})
  load(true)
}

// ── App filter ────────────────────────────────
function setApp(pkg){appFilter=pkg;closeDrawer();load(true)}

// ── Search ────────────────────────────────────
let st2;document.getElementById('si').addEventListener('input',e=>{clearTimeout(st2);searchQ=e.target.value.trim();st2=setTimeout(()=>load(true),350)})
function toggleSearch(){const bar=document.getElementById('sbar'),btn=document.getElementById('searchBtn');bar.hidden=!bar.hidden;btn.classList.toggle('on',!bar.hidden);if(!bar.hidden)document.getElementById('si').focus()}

// ── Actions ───────────────────────────────────
async function doRead(uid,btn){
  const n=notifs.find(x=>x._uid===uid);if(!n||n._kind!=='n')return
  try{await fetch(`${SERVER}/api/notifications/${n.id}/read`,{method:'PATCH',headers:hdrs()});n.is_read=true;if(appCounts[n.package_name])appCounts[n.package_name].unread=Math.max(0,appCounts[n.package_name].unread-1);const row=document.querySelector(`[data-id="${uid}"]`);if(row){row.classList.remove('unread');btn?.closest('.ca')?.remove()};renderAppLists()}catch{}
}
async function doArchive(uid){
  const n=notifs.find(x=>x._uid===uid);if(!n||n._kind!=='n')return
  const row=document.querySelector(`[data-id="${uid}"]`);if(row){row.classList.add('out');setTimeout(()=>row.remove(),190)}
  try{await fetch(`${SERVER}/api/notifications/${n.id}/archive`,{method:'PATCH',headers:hdrs()});if(!n.is_read&&appCounts[n.package_name])appCounts[n.package_name].unread=Math.max(0,appCounts[n.package_name].unread-1);if(appCounts[n.package_name])appCounts[n.package_name].total=Math.max(0,appCounts[n.package_name].total-1);const idx=notifs.findIndex(x=>x._uid===uid);if(idx!==-1)notifs.splice(idx,1);totalCount=Math.max(0,totalCount-1);renderAppLists()}catch{}
}
async function doDeleteText(uid){
  const n=notifs.find(x=>x._uid===uid);if(!n||n._kind!=='t')return
  const row=document.querySelector(`[data-id="${uid}"]`);if(row){row.classList.add('out');setTimeout(()=>row.remove(),190)}
  try{await fetch(`${SERVER}/api/typed-text`,{method:'DELETE',headers:hdrs(),body:JSON.stringify({ids:[n.id]})});if(appCounts[n.package_name])appCounts[n.package_name].total=Math.max(0,appCounts[n.package_name].total-1);const idx=notifs.findIndex(x=>x._uid===uid);if(idx!==-1)notifs.splice(idx,1);renderAppLists()}catch{}
}
async function doDeletePerm(uid){
  const n=notifs.find(x=>x._uid===uid);if(!n||n._kind!=='n')return
  if(!confirm('Delete permanently? The saved image (if any) is removed too.'))return
  const row=document.querySelector(`[data-id="${uid}"]`);if(row){row.classList.add('out');setTimeout(()=>row.remove(),190)}
  try{await fetch(`${SERVER}/api/notifications/${n.id}`,{method:'DELETE',headers:hdrs()});if(!n.is_read&&appCounts[n.package_name])appCounts[n.package_name].unread=Math.max(0,appCounts[n.package_name].unread-1);if(appCounts[n.package_name])appCounts[n.package_name].total=Math.max(0,appCounts[n.package_name].total-1);const idx=notifs.findIndex(x=>x._uid===uid);if(idx!==-1)notifs.splice(idx,1);totalCount=Math.max(0,totalCount-1);renderAppLists()}catch{}
}
async function purgeImages(){
  if(!confirm('Delete saved image files for archived notifications? The notification rows are kept.'))return
  try{const res=await fetch(`${SERVER}/api/notifications/purge-images`,{method:'POST',headers:hdrs(),body:JSON.stringify({scope:'archived'})});const j=await res.json();alert(`Purged ${j.purged||0} image(s).`)}catch{alert('Purge failed.')}
}
document.getElementById('feed').addEventListener('click',()=>{document.getElementById('nb').hidden=true;newPending=0})

// ── Select ────────────────────────────────────
function toggleSel(){
  selectMode=!selectMode;if(!selectMode)selectedIds.clear()
  document.getElementById('feed').classList.toggle('sel',selectMode)
  document.getElementById('selbar').classList.toggle('show',selectMode)
  document.getElementById('selectBtn').classList.toggle('on',selectMode)
  if(!selectMode)renderFeed();else updateSelUI()
}
function onRowClick(uid){if(!selectMode)return;selectedIds.has(uid)?selectedIds.delete(uid):selectedIds.add(uid);const row=document.querySelector(`[data-id="${uid}"]`);if(row)row.classList.toggle('selected',selectedIds.has(uid));updateSelUI()}
function toggleSelAll(){const vis=filteredNotifs(),all=vis.every(n=>selectedIds.has(n._uid));if(all)vis.forEach(n=>selectedIds.delete(n._uid));else vis.forEach(n=>selectedIds.add(n._uid));renderFeed()}
function updateSelUI(){const n=selectedIds.size;const info=document.getElementById('selinfo'),del=document.getElementById('seldel'),all=document.getElementById('selall');if(info)info.textContent=n>0?`${n} selected`:'Select items';if(del){del.disabled=n===0;del.textContent=n>0?`Delete ${n}`:'Delete'};if(all){const vis=filteredNotifs();all.textContent=(vis.length>0&&vis.every(x=>selectedIds.has(x._uid)))?'None':'All'}}

// ── Modal ─────────────────────────────────────
function showModal(){if(!selectedIds.size)return;document.getElementById('mlcnt').textContent=selectedIds.size;document.getElementById('modal').hidden=false}
function closeModal(){document.getElementById('modal').hidden=true}
async function execDelete(){
  const uids=[...selectedIds];closeModal()
  uids.forEach(uid=>{const r=document.querySelector(`[data-id="${uid}"]`);if(r){r.classList.add('out');setTimeout(()=>r.remove(),190)}})
  const nids=[],tids=[]
  for(const uid of uids){const it=notifs.find(x=>x._uid===uid);if(!it)continue;if(it._kind==='t')tids.push(it.id);else nids.push(it.id)}
  try{
    if(nids.length) await fetch(`${SERVER}/api/notifications`,{method:'DELETE',headers:hdrs(),body:JSON.stringify({ids:nids})})
    if(tids.length) await fetch(`${SERVER}/api/typed-text`,{method:'DELETE',headers:hdrs(),body:JSON.stringify({ids:tids})})
    for(const uid of uids){const idx=notifs.findIndex(n=>n._uid===uid);if(idx!==-1){const n=notifs[idx];if(n._kind==='n'&&!n.is_read&&appCounts[n.package_name])appCounts[n.package_name].unread=Math.max(0,appCounts[n.package_name].unread-1);if(appCounts[n.package_name])appCounts[n.package_name].total=Math.max(0,appCounts[n.package_name].total-1);notifs.splice(idx,1);totalCount=Math.max(0,totalCount-1)}}
    selectedIds.clear();selectMode=false
    document.getElementById('feed').classList.remove('sel');document.getElementById('selbar').classList.remove('show');document.getElementById('selectBtn').classList.remove('on')
    renderAppLists();renderFeed()
  }catch{}
}

// ── SSE ───────────────────────────────────────
let evs=null,reconn=null
function insertIncoming(n){
  notifs.unshift(n);totalCount++
  if(!appCounts[n.package_name])appCounts[n.package_name]={total:0,unread:0,label:n.app_label}
  appCounts[n.package_name].total++;if(n._kind==='n'&&!n.is_read)appCounts[n.package_name].unread++
  renderAppLists()
  if(appFilter&&n.package_name!==appFilter)return
  if(unreadOnly&&(n._kind!=='n'||n.is_read))return
  const feed=document.getElementById('feed'),nb=document.getElementById('nb')
  if(feed.scrollTop>100||selectMode||(timeFilter!=='all'&&timeFilter!=='1h'&&timeFilter!=='today')){newPending++;nb.hidden=false;nb.textContent=`↑ ${newPending} new item${newPending>1?'s':''} — tap to show`;nb.onclick=()=>{newPending=0;nb.hidden=true;setTime('all');load(true);feed.scrollTop=0}}
  else{const fg=document.querySelector('.ditems[data-i="0"]');if(fg){const div=document.createElement('div');div.innerHTML=buildRow(n);const r=div.firstChild;r.classList.add('incoming');fg.prepend(r)}else renderFeed()}
}
function connectSSE(){
  const dot=document.getElementById('sdot');if(evs)evs.close()
  evs=new EventSource(`${SERVER}/api/notifications/stream?token=${token}`)
  evs.addEventListener('connected',()=>{dot.className='sdot live';clearTimeout(reconn)})
  evs.addEventListener('notification',e=>{try{insertIncoming(normNotif(JSON.parse(e.data)))}catch{}})
  evs.addEventListener('typedtext',e=>{try{insertIncoming(normText(JSON.parse(e.data)))}catch{}})
  evs.onerror=()=>{dot.className='sdot';evs.close();reconn=setTimeout(connectSSE,5000)}
}

// ── Theme ─────────────────────────────────────
let theme='dark';try{theme=localStorage.getItem('nh-theme')||'dark'}catch{}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeColorMeta')?.setAttribute('content',t==='dark'?'#111111':'#f5f5f7');try{localStorage.setItem('nh-theme',t)}catch{}}
applyTheme(theme)
document.getElementById('themeBtn').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';applyTheme(theme)})

const st=document.createElement('style');st.textContent='@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}';document.head.appendChild(st)

setInterval(()=>{document.querySelectorAll('.ctime[data-ts]').forEach(el=>{const uid=el.closest('[data-id]')?.dataset.id;const n=notifs.find(x=>x._uid===uid);if(n)el.textContent=relTime(n.received_at||n.posted_at)})},60000)

document.getElementById('app').hidden=false
load(true);connectSSE()
</script>

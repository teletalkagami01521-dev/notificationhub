<title>NotifyHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" id="themeColorMeta" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NotifyHub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<style>
/* ── Tokens ──────────────────────────────── */
:root{
  --bg:#111;--surf:#1c1c1c;--surf2:#272727;--bord:#2c2c2c;
  --fg:#f0f0f0;--muted:#888;--accent:#3b82f6;--abg:rgba(59,130,246,.12);
  --danger:#ef4444;--live:#22c55e;--warn:#f59e0b;
  color-scheme:dark;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f5f5f7;--surf:#fff;--surf2:#ebebeb;--bord:#e0e0e0;
  --fg:#111;--muted:#666;--accent:#2563eb;--abg:rgba(37,99,235,.1);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f5f5f7;--surf:#fff;--surf2:#ebebeb;--bord:#e0e0e0;
  --fg:#111;--muted:#666;--accent:#2563eb;--abg:rgba(37,99,235,.1);
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}

/* ── Reset ───────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;height:100dvh;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  height:100%;font-family:'Inter',system-ui,sans-serif;font-size:15px;
  background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;
  overflow:hidden;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img{display:block}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.nosel{user-select:none;-webkit-user-select:none}

/* ── App shell ───────────────────────────── */
.shell{display:flex;flex-direction:column;height:100%;position:relative}
@media(min-width:1200px){
  .shell{max-width:1200px;margin:0 auto;border-left:1px solid var(--bord);border-right:1px solid var(--bord)}
}

/* ── Header ──────────────────────────────── */
/* Band that paints behind the status bar */
body::before{
  content:'';position:fixed;inset:0 0 auto;
  height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50;
}
header{
  padding-left:max(14px,env(safe-area-inset-left,0px));
  padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
  min-height:calc(56px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:6px;
  background:var(--bg);border-bottom:1px solid var(--bord);
  flex-shrink:0;position:sticky;top:0;z-index:40;
}
.htitle{font-size:21px;font-weight:800;flex:1;letter-spacing:-.5px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex-shrink:0;transition:background .4s}
.sdot.live{background:var(--live)}
.hbtns{display:flex;gap:1px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);transition:background .1s,color .1s;flex-shrink:0}
.ib:active{background:var(--surf2)}
@media(hover:hover){.ib:hover{background:var(--surf2)}}
.ib.on{color:var(--accent)}

/* ── Search bar ──────────────────────────── */
.sbar{
  padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
  background:var(--bg);border-bottom:1px solid var(--bord);flex-shrink:0;
}
.sbar[hidden]{display:none!important}
.swrap{position:relative}
.swrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#si{width:100%;padding:10px 12px 10px 34px;background:var(--surf);border:none;
  border-radius:50px;color:var(--fg);font-size:15px;font-family:inherit;outline:none}
#si::placeholder{color:var(--muted)}

/* ── New banner ──────────────────────────── */
.nb{background:var(--accent);color:#fff;font-size:13px;font-weight:600;
  text-align:center;padding:9px;cursor:pointer;flex-shrink:0}
.nb[hidden]{display:none!important}

/* ── Body ────────────────────────────────── */
.body{flex:1;display:flex;min-height:0;overflow:hidden}

/* ── Sidebar (tablet ≥ 768px) ────────────── */
#sidebar{
  display:none;width:260px;flex-shrink:0;
  border-right:1px solid var(--bord);flex-direction:column;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
}
@media(min-width:768px){#sidebar{display:flex}}
.sb-sec{padding:12px 12px 8px;border-bottom:1px solid var(--bord)}
.sb-lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sb-tbtn{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:9px 10px;border-radius:10px;color:var(--muted);
  font-size:13px;font-weight:500;text-align:left;
  user-select:none;-webkit-user-select:none;transition:background .1s,color .1s;margin-bottom:2px
}
.sb-tbtn:active{background:var(--surf2)}
@media(hover:hover){.sb-tbtn:hover{background:var(--surf)}}
.sb-tbtn.on{background:var(--abg);color:var(--accent);font-weight:600}
.sb-tbtn svg{flex-shrink:0;opacity:.6}
.sb-tbtn.on svg{opacity:1}
.sb-app{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  transition:background .1s;margin-bottom:2px
}
.sb-app:active{background:var(--surf2)}
@media(hover:hover){.sb-app:hover{background:var(--surf)}}
.sb-app.on{background:var(--abg)}
.sb-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;position:relative;overflow:hidden}
.sb-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.sb-av.iv img{opacity:1}.sb-av.iv span{opacity:0}
.sb-av span{transition:opacity .2s;position:relative;z-index:1}
.sb-aname{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.sb-app.on .sb-aname{color:var(--accent);font-weight:600}
.sb-badge{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:50px;padding:1px 6px;min-width:18px;text-align:center}
.sb-badge:empty{display:none}

/* ── Feed ─────────────────────────────────── */
#feed{flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;min-width:0;
  padding-bottom:env(safe-area-inset-bottom,0px)}
@media(max-width:767px){
  #feed{padding-bottom:calc(60px + env(safe-area-inset-bottom,16px))}
}

/* ── Day separator ───────────────────────── */
.dsep{
  display:flex;align-items:center;gap:8px;
  padding:14px max(14px,env(safe-area-inset-right,0px)) 4px max(14px,env(safe-area-inset-left,0px));
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);cursor:pointer;user-select:none;-webkit-user-select:none;
}
.dsep::before,.dsep::after{content:'';flex:1;height:1px;background:var(--bord)}
.dsep-chev{transition:transform .18s;flex-shrink:0}
.dsep.col .dsep-chev{transform:rotate(-90deg)}
.ditems[hidden]{display:none!important}

/* ── Message rows (chat bubble layout) ───────── */
.cr{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;background:var(--bg)}
.cr-inner{
  display:flex;align-items:flex-end;gap:8px;
  padding:3px max(14px,env(safe-area-inset-right,0px)) 3px max(14px,env(safe-area-inset-left,0px));
  position:relative;z-index:1;background:var(--bg);
  transition:transform .22s cubic-bezier(.4,0,.2,1);touch-action:pan-y;
}
.cr:not(.typed) .cr-inner{padding-right:calc(max(14px,env(safe-area-inset-right,0px)) + 22%)}
.cr.typed .cr-inner{flex-direction:row-reverse;padding-left:calc(max(14px,env(safe-area-inset-left,0px)) + 22%)}
#feed.sel .cr{cursor:pointer}
.cr.incoming{animation:slideIn .22s ease-out}
.cr.out{animation:slideOut .18s ease-in forwards;overflow:hidden;pointer-events:none}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;max-height:0;padding:0}}
@media(prefers-reduced-motion:reduce){.cr.incoming,.cr.out{animation:none}}
.swipe-del{
  position:absolute;right:0;top:0;bottom:0;width:72px;z-index:0;
  background:var(--danger);display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* ── Notification avatar (left, 38px) ─────────── */
.cav{width:38px;height:38px;border-radius:50%;position:relative;flex-shrink:0}
.cav-in{
  width:38px;height:38px;border-radius:50%;overflow:hidden;
  position:relative;display:grid;place-items:center;
}
.cai{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .22s;border-radius:50%}
.cav-in.iv .cai{opacity:1}.cav-in.iv .cal{opacity:0}
.cal{font-size:15px;font-weight:700;color:#fff;position:relative;z-index:1;pointer-events:none;transition:opacity .2s}
.udot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);display:none;z-index:3}
.cr.unread .udot{display:block}
.cck{position:absolute;inset:0;width:38px;height:38px;border-radius:50%;background:var(--accent);
  display:grid;place-items:center;z-index:4;opacity:0;transition:opacity .12s}
#feed:not(.sel) .cck{display:none!important}
.cr.selected .cck{opacity:1}

/* ── Typed mini-icon (right, 28px) ───────────── */
.tav{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  position:relative;overflow:hidden;display:grid;place-items:center;
}
.tav .cai{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;border-radius:50%;transition:opacity .22s}
.tav.iv .cai{opacity:1}.tav.iv .tcal{opacity:0}
.tcal{font-size:11px;font-weight:700;color:#fff;position:relative;z-index:1;transition:opacity .2s}

/* ── Bubble ──────────────────────────────────── */
.bubble{
  flex:1;min-width:0;padding:9px 12px;
  border-radius:14px;position:relative;overflow:hidden;
}
/* Notification bubble: surface card, left-corner square */
.cr:not(.typed) .bubble{
  background:var(--surf);border:1px solid var(--bord);
  border-radius:2px 14px 14px 14px;
}
.cr:not(.typed):active .bubble{background:var(--surf2)}
@media(hover:hover){.cr:not(.typed):hover .bubble{background:var(--surf2)}}
/* Unread: accent left border */
.cr.unread .bubble{border-left:2.5px solid var(--accent)}
/* Selected notification */
#feed.sel .cr.selected:not(.typed) .bubble{background:var(--abg);border-color:var(--accent)}
/* Typed bubble: accent filled, right-corner square */
.cr.typed .bubble{
  background:var(--accent);color:#fff;
  border-radius:14px 2px 14px 14px;
}
.cr.typed:active .bubble{filter:brightness(.88)}
@media(hover:hover){.cr.typed:hover .bubble{filter:brightness(.88)}}
#feed.sel .cr.typed.selected .bubble{filter:brightness(.8)}

/* Bubble header row */
.bh{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.bname{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cr.typed .bname{color:rgba(255,255,255,.75)}
.btime{font-size:11px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.cr.typed .btime{color:rgba(255,255,255,.65)}
.cr.unread .btime{color:var(--accent);font-weight:600}
/* Bubble body text */
.bmsg{font-size:14px;line-height:1.5;word-break:break-word;color:var(--muted)}
.cr.unread .bmsg{color:var(--fg);font-weight:500}
.cr.typed .bmsg{color:#fff;font-style:italic}
/* Notification image */
.cimg{margin-top:8px;border-radius:8px;overflow:hidden;border:1px solid var(--bord)}
.cimg img{display:block;width:100%;height:auto;max-height:200px;object-fit:cover}

/* ── Quick actions (column, beside bubble) ─────── */
.cacts{display:flex;flex-direction:column;gap:1px;flex-shrink:0;opacity:0;
  transition:opacity .12s;padding-bottom:1px}
@media(hover:hover){.cr:hover .cacts{opacity:1}}
@media(hover:none){.cacts{opacity:1}}
#feed.sel .cacts{display:none!important}
.ca{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);transition:background .1s,color .1s;touch-action:manipulation;flex-shrink:0}
.ca:active{background:var(--surf2)}
@media(hover:hover){.ca:hover{background:var(--surf2);color:var(--fg)}.ca.del:hover{color:var(--danger)}}

/* ── Skeleton ──────────────────────────────── */
.skelwrap{padding:6px 0}
.skelrow{display:flex;align-items:center;gap:12px;
  padding:11px max(14px,env(safe-area-inset-right,0px)) 11px max(14px,env(safe-area-inset-left,0px));min-height:68px}
.skelav{width:52px;height:52px;border-radius:50%;background:var(--surf);animation:blink 1.6s infinite;flex-shrink:0}
.skelbody{flex:1;display:flex;flex-direction:column;gap:7px}
.skelln{height:12px;border-radius:6px;background:var(--surf);animation:blink 1.6s infinite}
.skelln.w80{width:80%}.skelln.w55{width:55%}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:.8}}

/* ── Empty ─────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;padding:72px 24px;
  text-align:center;color:var(--muted);gap:10px}
.empty svg{opacity:.2}
.empty p{font-size:15px}

/* ── Top load-more sentinel ──────────────────── */
.top-sentinel{height:4px}
.top-loading{display:flex;justify-content:center;padding:14px 0 6px;
  animation:fadeInDown .2s ease-out}
.tl-spin{width:20px;height:20px;border-radius:50%;
  border:2px solid var(--bord);border-top-color:var(--accent);
  animation:spin .75s linear infinite}
.top-uptodate{text-align:center;padding:10px 0 2px;font-size:12px;color:var(--muted)}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ── Bottom navigation (mobile only) ─────────── */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(56px + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);border-top:1px solid var(--bord);
  display:flex;align-items:center;z-index:30;
}
@media(min-width:768px){.bnav{display:none}}
@media(min-width:1200px){
  .bnav{max-width:1200px;left:50%;transform:translateX(-50%)}
}
.bntab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:5px 4px;color:var(--muted);position:relative;
  font-size:11px;font-weight:500;min-height:56px;transition:color .15s;
}
.bntab:active{background:var(--surf2)}
.bntab.on{color:var(--accent)}
.bntab.on::before{
  content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);
  width:52px;height:26px;background:var(--abg);border-radius:13px;z-index:-1;
}
.bntab-pill{
  position:absolute;top:4px;right:calc(50% - 22px);
  min-width:16px;height:16px;border-radius:8px;padding:0 4px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.bntab-pill:empty{display:none}

/* ── Select bar ─────────────────────────────── */
.selbar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);border-top:1px solid var(--bord);
  display:flex;align-items:center;gap:8px;
  padding:10px max(14px,env(safe-area-inset-right,0px))
           max(calc(60px + env(safe-area-inset-bottom,10px)),18px)
           max(14px,env(safe-area-inset-left,0px));
  z-index:35;transform:translateY(110%);transition:transform .22s cubic-bezier(.4,0,.2,1);
}
@media(min-width:768px){
  .selbar{left:260px;padding-bottom:max(13px,env(safe-area-inset-bottom,0px))}
}
@media(min-width:1200px){
  .selbar{max-width:calc(1200px - 260px);left:50%;right:auto;transform:translateX(-50%) translateY(110%)}
  .selbar.show{transform:translateX(-50%)}
}
.selbar.show{transform:none}
.sbc{padding:9px 15px;border-radius:50px;background:var(--surf);color:var(--muted);font-size:14px;font-weight:500;touch-action:manipulation}
.sbi{flex:1;font-size:13px;color:var(--muted);text-align:center}
.sball{padding:9px 15px;border-radius:50px;color:var(--accent);font-size:14px;font-weight:600;touch-action:manipulation}
.sbdel{padding:9px 18px;border-radius:50px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;touch-action:manipulation}
.sbdel:disabled{opacity:.38}

/* ── Bottom sheet (mobile filter) ────────────── */
.sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:59;display:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet-ov.open{display:block}
@media(min-width:768px){.sheet-ov,.sheet{display:none!important}}
.sheet{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);border-top:1.5px solid var(--bord);border-radius:20px 20px 0 0;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:60;display:flex;flex-direction:column;
  max-height:85dvh;padding-bottom:env(safe-area-inset-bottom,0px);
}
.sheet.open{transform:none}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--bord);margin:12px auto 0;flex-shrink:0}
.sheet-head{display:flex;align-items:center;padding:12px 16px 8px;flex-shrink:0}
.sheet-title{font-size:16px;font-weight:700;flex:1}
.sheet-body{overflow-y:auto;flex:1;padding-bottom:12px}
.sheet-sec{padding:12px 16px;border-bottom:1px solid var(--bord)}
.sheet-sec:last-child{border-bottom:none}
.sheet-stitle{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sheet-tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stb{padding:10px 12px;border-radius:12px;border:1.5px solid var(--bord);color:var(--muted);
  font-size:13px;font-weight:500;text-align:left;touch-action:manipulation;
  transition:background .1s,color .1s,border-color .1s}
.stb.on{background:var(--abg);border-color:var(--accent);color:var(--accent);font-weight:600}
.sapp{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;
  cursor:pointer;margin-bottom:2px;touch-action:manipulation;transition:background .1s}
.sapp:active{background:var(--surf2)}.sapp.on{background:var(--abg)}
.sav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;position:relative;overflow:hidden}
.sav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.sav.iv img{opacity:1}.sav.iv span{opacity:0}
.sav span{transition:opacity .2s;position:relative;z-index:1}
.savn{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savb{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:50px;padding:1px 6px}
.savb:empty{display:none}

/* ── Tablet drawer ────────────────────────────── */
.drov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:59;display:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.drov.open{display:block}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(280px,88vw);
  background:var(--bg);border-left:1px solid var(--bord);
  transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  z-index:60;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
.drawer.open{transform:none}
.drhead{display:flex;align-items:center;padding:13px 12px 13px 14px;border-bottom:1px solid var(--bord);flex-shrink:0}
.drtitle{font-size:16px;font-weight:700;flex:1}
.drbody{overflow-y:auto;flex:1;padding:0 0 max(24px,env(safe-area-inset-bottom,0px))}
.drsec{padding:12px 14px;border-bottom:1px solid var(--bord)}

.dtb.on{background:var(--abg);border-color:var(--accent);color:var(--accent);font-weight:600}
.dapp{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
  cursor:pointer;touch-action:manipulation;margin-bottom:2px;transition:background .1s}
.dapp:active{background:var(--surf2)}

  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;position:relative;overflow:hidden}
.dav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.dav.iv img{opacity:1}.dav.iv span{opacity:0}
.dav span{transition:opacity .2s;position:relative;z-index:1}
.davn{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.davb{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:50px;padding:1px 6px}

/* ── Modal ─────────────────────────────────── */
.mlov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;
  z-index:80;padding:24px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}

@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.mlico{font-size:34px;margin-bottom:10px}
.mlh{font-size:17px;font-weight:700;margin-bottom:5px}
.mls{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}

.mlcon{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;
  background:var(--accent);color:#fff;border:none;touch-action:manipulation}

/* ── Tablet layout ───────────────────────────── */

/* ── Device selector ─────────────────────────── */
.hdevchip{
  display:flex;align-items:center;gap:3px;padding:4px 9px;border-radius:50px;
  background:var(--surf);border:1.5px solid var(--bord);color:var(--fg);
  font-size:12px;font-weight:600;white-space:nowrap;touch-action:manipulation;
  transition:background .1s,border-color .1s;max-width:130px;overflow:hidden;
  flex-shrink:0;
}
.hdevchip:active{background:var(--surf2)}
@media(hover:hover){.hdevchip:hover{background:var(--surf2)}}
.hdevchip.filtered{border-color:var(--accent);color:var(--accent)}
.hdevchip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Device sheet items */
.dv-sec{padding:10px 8px 4px;border-bottom:1px solid var(--bord)}

.dv-stitle{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 8px 8px}
.dv-item{

  cursor:pointer;transition:background .1s;user-select:none;-webkit-user-select:none;
  margin-bottom:1px;

.dv-item:active{background:var(--surf2)}
@media(hover:hover){.dv-item:hover{background:var(--surf)}}
.dv-item.on{background:var(--abg)}

}

.dv-item.on .dv-name{color:var(--accent)}

.dv-acts{display:flex;gap:1px;flex-shrink:0;align-items:center}

  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;

  touch-action:manipulation;
}
.dv-star:active{color:var(--warn)}
.dv-star.on{color:var(--warn)}
@media(hover:hover){.dv-star:hover{background:var(--surf2);color:var(--warn)}}
.dv-del{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);transition:background .1s,color .1s;touch-action:manipulation;
}
.dv-del:active{color:var(--danger)}
@media(hover:hover){.dv-del:hover{background:var(--surf2);color:var(--danger)}}

  padding:28px 16px;color:var(--muted);font-size:13px}

<script>
const SERVER='https://notificationhub-10g2.onrender.com'
const token='solaimankabiranik'
const hdrs=()=>({'Authorization':`Bearer ${token}`,'Content-Type':'application/json'})

fetch(`${SERVER}/health`,{cache:'no-store'}).catch(()=>{})
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{})

// ── Domain map ────────────────────────────────
const DOMAIN_MAP={
  'com.google.android.gm':'gmail.com','com.google.android.youtube':'youtube.com',
  'com.google.android.apps.messaging':'messages.google.com','com.google.android.apps.maps':'maps.google.com',
  'com.google.android.calendar':'calendar.google.com','com.google.android.keep':'keep.google.com',
  'com.google.android.apps.docs':'docs.google.com','com.google.android.apps.photos':'photos.google.com',
  'com.google.android.apps.translate':'translate.google.com','com.google.android.apps.youtube.music':'music.youtube.com',

  'com.whatsapp':'whatsapp.com','com.whatsapp.w4b':'whatsapp.com',
  'com.twitter.android':'x.com','com.x.android':'x.com',
  'org.telegram.messenger':'telegram.org','org.telegram.plus':'telegram.org',
  'org.thunderdog.challegram':'telegram.org','com.snapchat.android':'snapchat.com',
  'com.zhiliaoapp.musically':'tiktok.com','com.linkedin.android':'linkedin.com',
  'com.reddit.frontpage':'reddit.com','com.discord':'discord.com',
  'com.Slack':'slack.com','com.microsoft.teams':'teams.microsoft.com',
  'us.zoom.videomeetings':'zoom.us','com.spotify.music':'spotify.com',
  'com.netflix.mediaclient':'netflix.com','com.amazon.mShop.android.shopping':'amazon.com',
  'com.bkash.business':'bkash.com','com.nagad.app':'nagad.com.bd',
  'com.dbbl.mobilebanking':'dutchbanglabank.com','com.bracbank.astha':'bracbank.com',
  'com.pathao.user':'pathao.com','com.shohoz.android':'shohoz.com',
  'com.ubercab':'uber.com','com.daraz.android':'daraz.com.bd',
  'com.chaldal.android':'chaldal.com','com.duolingo':'duolingo.com',
  'com.paypal.android.p2pmobile':'paypal.com','com.microsoft.office.outlook':'outlook.com',
}

function iconSrcs(pkg){
  let d=DOMAIN_MAP[pkg]
  if(!d){const p=pkg.split('.');if(p.length>=2&&['com','org','net','io','app','co'].includes(p[0]))d=p[1]+'.com';else return[]}
  const b=d.split('/')[0]
  return[`https://logo.clearbit.com/${b}`,`https://www.google.com/s2/favicons?domain=${d}&sz=128`]
}
function tryNextIcon(el){
  try{const srcs=JSON.parse(el.dataset.srcs||'[]'),si=parseInt(el.dataset.si||'0')+1;el.dataset.si=si;if(si<srcs.length){const img=el.querySelector('.cai,.sb-av img,[class*=img]');if(img) img.src=srcs[si]}}catch{}
}

// ── Utils ─────────────────────────────────────
const PAL=['#1877f2','#e91e63','#9c27b0','#00897b','#e65100','#1565c0','#2e7d32','#6a1b9a','#c62828','#37474f']
function appColor(p){let h=0;for(let i=0;i<p.length;i++)h=((h<<5)-h+p.charCodeAt(i))|0;return PAL[Math.abs(h)%PAL.length]}
function appInit(l){return(l||'?').trim()[0].toUpperCase()}
function relTime(iso){const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'}
const TZ='Asia/Dhaka'
const dtfGmt6=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})
const dayKeyFmt=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'})
function fmtGmt6(iso){if(!iso)return'';const d=new Date(iso);if(isNaN(d))return'';return dtfGmt6.format(d)}
function timeLabel(iso){const abs=fmtGmt6(iso);return abs?`${relTime(iso)} · ${abs}`:relTime(iso)}
function dayKey(iso){const d=new Date(iso);return isNaN(d)?'':dayKeyFmt.format(d)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function imgUrl(u){return !u?'' : (u.startsWith('http')?u:`${SERVER}${u}?token=${encodeURIComponent(token)}`)}

// ── Item normalisation ─────────────────────────
function normNotif(n){return{_kind:'n',_uid:'n'+n.id,...n}}
function normText(t){return{_kind:'t',_uid:'t'+t.id,id:t.id,package_name:t.package_name,app_label:t.app_label,title:null,text_body:t.text,received_at:t.received_at,captured_at:t.captured_at,is_read:true}}
function sortItems(){notifs.sort((a,b)=>new Date(b.received_at||b.posted_at)-new Date(a.received_at||a.posted_at))}

// ── State ─────────────────────────────────────
let notifs=[],appFilter=null,searchQ='',timeFilter='all',unreadOnly=false
let page=1,totalCount=0,hasMore=false,newPending=0
let appCounts={},selectMode=false,selectedIds=new Set()
let currentGroups=[],userToggledDays=new Set()
let activeTab='all'
let loadingMore=false,scrollToBottom=true,topObserver=null
let devices=[],deviceFilter=null,defaultDevice=null
try{const d=localStorage.getItem('nh-device');if(d){deviceFilter=d;defaultDevice=d}}catch{}

// ── Bottom nav tab switch ──────────────────────
function switchTab(tab){
  if(tab==='apps'||tab==='filter'){openSheet();return}
  activeTab=tab
  document.querySelectorAll('.bntab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab))
  if(tab==='all'){unreadOnly=false;renderFeed()}
  if(tab==='unread'){
    unreadOnly=true;renderFeed()
    // Clear badge — user is now viewing unreads
    const badge=document.getElementById('unreadBadge');if(badge)badge.textContent=''
  }
}

// ── Sheet (mobile filter) ──────────────────────
function openSheet(){document.getElementById('sheet').classList.add('open');document.getElementById('sheetOv').classList.add('open')}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('sheetOv').classList.remove('open')}

// ── Drawer ────────────────────────────────────
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('drov').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drov').classList.remove('open')}

// ── Filters ───────────────────────────────────
function setTime(t){
  timeFilter=t
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))
  renderFeed()
}
function filteredNotifs(){
  const now=Date.now(),nowKey=dayKey(new Date(now))
  return notifs.filter(n=>{
    if(unreadOnly&&(n._kind!=='n'||n.is_read))return false
    if(appFilter&&n.package_name!==appFilter) return false
    if(searchQ){const q=searchQ.toLowerCase();if(!(n.title||'').toLowerCase().includes(q)&&!(n.text_body||'').toLowerCase().includes(q)&&!(n.app_label||'').toLowerCase().includes(q)) return false}
    const iso=n.received_at||n.posted_at,t=new Date(iso).getTime()
    if(timeFilter==='today') return dayKey(iso)===nowKey
    if(timeFilter==='earlier') return dayKey(iso)!==nowKey
    const h=parseInt(timeFilter);if(!isNaN(h)) return now-t<=h*3600000
    return true
  })
}

// ── Day grouping ──────────────────────────────
function groupByDay(list){
  const map=new Map(),nowKey=dayKey(new Date()),yesKey=dayKey(new Date(Date.now()-86400000))
  for(const n of list){
    const iso=n.received_at||n.posted_at,key=dayKey(iso),d=new Date(iso)
    const lbl=key===nowKey?'Today':key===yesKey?'Yesterday':d.toLocaleDateString('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'})
    const tk=key?new Date(`${key}T00:00:00+06:00`).getTime():0
    if(!map.has(key))map.set(key,{lbl,tk,items:[]})
    map.get(key).items.push(n)
  }
  return[...map.values()].sort((a,b)=>b.tk-a.tk)
}
function isDayCol(lbl){const def=lbl!=='Today'&&lbl!=='Yesterday';return userToggledDays.has(lbl)?!def:def}
function toggleDay(idx){
  const g=currentGroups[idx];if(!g) return
  userToggledDays.has(g.lbl)?userToggledDays.delete(g.lbl):userToggledDays.add(g.lbl)
  const hdr=document.querySelector(`.dsep[data-i="${idx}"]`),items=document.querySelector(`.ditems[data-i="${idx}"]`)
  if(hdr&&items){const col=isDayCol(g.lbl);hdr.classList.toggle('col',col);items.hidden=col}
}

// ── Build row ─────────────────────────────────
const CHK=`<svg width="14" height="14" viewBox="0 0 16 16" fill="white"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg>`
const ICO_DEL=`<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"/></svg>`
const ICO_TRASH=`<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M6.5 1a.5.5 0 00-.5.5V2H3.5a.5.5 0 000 1h.6l.7 10.2a1 1 0 001 .8h4.4a1 1 0 001-.8L12.9 3h.6a.5.5 0 000-1H10V1.5a.5.5 0 00-.5-.5h-3zM5.13 3h5.74l-.68 9.7a.1.1 0 01-.1.08H5.91a.1.1 0 01-.1-.08L5.13 3z"/></svg>`
const ICO_READ=`<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg>`

function buildRow(n){
  const sel=selectedIds.has(n._uid)
  const isText=n._kind==='t'
  const unread=!isText&&!n.is_read
  const app=esc(n.app_label||n.package_name.split('.').pop())
  const srcs=iconSrcs(n.package_name),color=appColor(n.package_name),letter=appInit(n.app_label||n.package_name)
  const enc=srcs.length?` data-srcs="${esc(JSON.stringify(srcs))}" data-si="0"`:''
  const img=srcs.length?`<img class="cai" src="${esc(srcs[0])}" loading="lazy" onload="this.parentElement.classList.add('iv')" onerror="tryNextIcon(this.parentElement)" alt="">`:''
  const ts=esc(n.received_at||n.captured_at||n.posted_at)

  if(isText){
    // ── Typed text: right-side bubble ──────────────
    return`<div class="cr typed${sel?' selected':''}" data-id="${n._uid}" onclick="onRowClick('${n._uid}')">
      <div class="cr-inner">
        <div class="cacts">
          <button class="ca del nosel" onclick="event.stopPropagation();doDeleteText('${n._uid}')" title="Delete">${ICO_TRASH}</button>
        </div>
        <div class="bubble">
          <div class="bh"><span class="bname">${app}</span><span class="btime" data-ts="${ts}" title="${ts}">${timeLabel(n.received_at||n.captured_at||n.posted_at)}</span></div>
          <div class="bmsg">${esc(n.text_body||'')}</div>
        </div>
        <div class="tav" style="background:${color}"${enc}>${img}<span class="tcal">${letter}</span></div>
      </div>
    </div>`
  } else {
    // ── Notification: left-side bubble ─────────────
    const preview=esc(n.title&&n.text_body?`${n.title}: ${n.text_body}`:(n.title||n.text_body||'No preview'))
    const thumb=n.image_url?`<a class="cimg" href="${esc(imgUrl(n.image_url))}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><img src="${esc(imgUrl(n.image_url))}" loading="lazy" alt=""></a>`:''
    return`<div class="cr${unread?' unread':''}${sel?' selected':''}" data-id="${n._uid}" onclick="onRowClick('${n._uid}')">
      <div class="cr-inner">
        <div class="cav"><div class="cav-in" style="background:${color}"${enc}>${img}<span class="cal">${letter}</span></div><div class="udot"></div><div class="cck">${CHK}</div></div>
        <div class="bubble">
          <div class="bh"><span class="bname">${app}</span><span class="btime" data-ts="${ts}" title="${ts}">${timeLabel(n.received_at||n.posted_at)}</span></div>
          <div class="bmsg">${preview}</div>
          ${thumb}
        </div>
        <div class="cacts">
          ${unread?`<button class="ca nosel" onclick="event.stopPropagation();doRead('${n._uid}',this)" title="Mark read">${ICO_READ}</button>`:''}
          <button class="ca del nosel" onclick="event.stopPropagation();doArchive('${n._uid}')" title="Archive">${ICO_DEL}</button>
          <button class="ca del nosel" onclick="event.stopPropagation();doDeletePerm('${n._uid}')" title="Delete">${ICO_TRASH}</button>
        </div>
      </div>
    </div>`
  }
}

// ── Render feed ───────────────────────────────
function renderFeed(){
  const feed=document.getElementById('feed'),vis=filteredNotifs()
  if(!vis.length){
    const msg=unreadOnly?'No unread notifications':notifs.length?'No results':'No notifications yet'
    feed.innerHTML=`<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg><p>${msg}</p></div>`
    return
  }
  currentGroups=groupByDay(vis) // newest-first (index 0 = today)
  const CHEV=`<svg class="dsep-chev" width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M4.427 7.427l3.396 3.396a.25.25 0 00.354 0l3.396-3.396A.25.25 0 0011.396 7H4.604a.25.25 0 00-.177.427z"/></svg>`

  // Chat layout: oldest day at visual top, newest at visual bottom
  // Render groups in reverse (oldest first in HTML = top of scroll)
  // Items within each day also reversed (oldest first = bottom of day group)
  let html=hasMore
    ?`<div class="top-loading"><div class="tl-spin"></div></div>`
    :`<div class="top-uptodate">· Beginning of history ·</div>`
  html+=`<div id="topSentinel" class="top-sentinel"></div>`

  const reversed=[...currentGroups].reverse() // oldest first
  for(let ri=0;ri<reversed.length;ri++){
    const g=reversed[ri],i=currentGroups.indexOf(g),col=isDayCol(g.lbl)
    const items=[...g.items].reverse() // oldest first within day = newest at bottom
    html+=`<div><div class="dsep nosel${col?' col':''}" data-i="${i}" onclick="toggleDay(${i})">${esc(g.lbl)}<span style="font-weight:400;font-size:10px;margin-left:4px;opacity:.7">${g.items.length}</span>${CHEV}</div><div class="ditems" data-i="${i}"${col?' hidden':''}>${items.map(buildRow).join('')}</div></div>`
  }
  feed.innerHTML=html;updateSelUI()

  if(scrollToBottom) requestAnimationFrame(()=>feed.scrollTop=feed.scrollHeight)
  initTopObserver()
  if(!selectMode) requestAnimationFrame(initSwipeHandlers)
}

// ── Infinite scroll observer ──────────────────
function initTopObserver(){
  if(topObserver){topObserver.disconnect();topObserver=null}
  const sentinel=document.getElementById('topSentinel'),feed=document.getElementById('feed')
  if(!sentinel||!feed) return
  topObserver=new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting&&!loadingMore&&hasMore) loadMore()
  },{root:feed,rootMargin:'80px 0px 0px 0px',threshold:0})
  topObserver.observe(sentinel)
}

// ── App lists (sidebar + drawer + sheet) ──────
function iconImg(pkg,lbl,cls){

function renderAppLists(){

// ── App counts ────────────────────────────────
function rebuildAppCounts(){
  appCounts={}
  for(const it of notifs){
    if(!appCounts[it.package_name])appCounts[it.package_name]={total:0,unread:0,label:it.app_label}
    appCounts[it.package_name].total++
    if(it._kind==='n'&&!it.is_read)appCounts[it.package_name].unread++
  }
}

// ── Load ──────────────────────────────────────
async function load(reset=false){
  if(reset){page=1;notifs=[]}
  const p=new URLSearchParams({page,limit:50})
  if(appFilter)    p.set('package',appFilter)
  if(searchQ)      p.set('search',searchQ)
  if(deviceFilter) p.set('device_id',deviceFilter)
  try{
    const res=await fetch(`${SERVER}/api/notifications?${p}`,{headers:hdrs()})
    if(res.status===401){location.reload();return}
    const json=await res.json(),rows=(json.data||[]).map(normNotif)
    if(reset){
      notifs=rows
      try{
        const tp=new URLSearchParams({limit:200})
        if(appFilter) tp.set('package',appFilter)
        if(searchQ)   tp.set('search',searchQ)
        const tr=await fetch(`${SERVER}/api/typed-text?${tp}`,{headers:hdrs()})
        if(tr.ok){const tj=await tr.json();notifs=notifs.concat((tj.data||[]).map(normText))}
      }catch{}
      sortItems();rebuildAppCounts()
      if(!devices.length) loadDevices() // first load: fetch device list
    } else notifs=[...notifs,...rows]
    totalCount=json.pagination?.total??notifs.length;hasMore=json.pagination?.hasMore??false
    renderAppLists();renderFeed()
  }catch{document.getElementById('feed').innerHTML=`<div class="empty"><p style="color:var(--danger)">Could not load</p></div>`}
}
async function loadMore(){
  if(loadingMore||!hasMore)return
  loadingMore=true;scrollToBottom=false
  const feed=document.getElementById('feed')
  const prevH=feed.scrollHeight,prevTop=feed.scrollTop
  page++;await load(false)
  requestAnimationFrame(()=>{
    feed.scrollTop=prevTop+(feed.scrollHeight-prevH)
    loadingMore=false;scrollToBottom=true
  })
}
function doRefresh(){
  const btn=document.getElementById('refreshBtn')
  btn.style.animation='spin .6s ease-in-out'
  btn.addEventListener('animationend',()=>btn.style.animation='',{once:true})
  load(true)
}

    for(const uid of uids){const idx=notifs.findIndex(n=>n._uid===uid);if(idx!==-1){const n=notifs[idx];if(n._kind==='n'&&!n.is_read&&appCounts[n.package_name])appCounts[n.package_name].unread=Math.max(0,appCounts[n.package_name].unread-1);if(appCounts[n.package_name])appCounts[n.package_name].total=Math.max(0,appCounts[n.package_name].total-1);notifs.splice(idx,1);totalCount=Math.max(0,totalCount-1)}}

// ── SSE ───────────────────────────────────────
let evs=null,reconn=null
function insertIncoming(n){
  notifs.unshift(n);totalCount++
  if(!appCounts[n.package_name])appCounts[n.package_name]={total:0,unread:0,label:n.app_label}
  appCounts[n.package_name].total++;if(n._kind==='n'&&!n.is_read)appCounts[n.package_name].unread++
  renderAppLists()
  if(appFilter&&n.package_name!==appFilter)return
  if(unreadOnly&&(n._kind!=='n'||n.is_read))return
  const feed=document.getElementById('feed'),nb=document.getElementById('nb')
  // "at bottom" means user sees latest messages (scrollTop near scrollHeight)
  const atBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<120
  if(!atBottom||selectMode||(timeFilter!=='all'&&timeFilter!=='1h'&&timeFilter!=='today')){
    newPending++;nb.hidden=false;nb.textContent=`↓ ${newPending} new — tap to view`
    nb.onclick=()=>{newPending=0;nb.hidden=true;setTime('all');load(true)}
  } else {
    // Append to today's group (index 0) — newest at bottom
    const fg=document.querySelector('.ditems[data-i="0"]')
    if(fg){const div=document.createElement('div');div.innerHTML=buildRow(n);const r=div.firstChild;r.classList.add('incoming');fg.appendChild(r);requestAnimationFrame(()=>{feed.scrollTop=feed.scrollHeight;initSwipeHandlers()})}
    else renderFeed()
  }
}
function connectSSE(){
  const dot=document.getElementById('sdot');if(evs)evs.close()
  evs=new EventSource(`${SERVER}/api/notifications/stream?token=${token}`)
  evs.addEventListener('connected',()=>{dot.className='sdot live';clearTimeout(reconn)})
  evs.addEventListener('notification',e=>{try{insertIncoming(normNotif(JSON.parse(e.data)))}catch{}})
  evs.addEventListener('typedtext',e=>{try{insertIncoming(normText(JSON.parse(e.data)))}catch{}})
  evs.onerror=()=>{dot.className='sdot';evs.close();reconn=setTimeout(connectSSE,5000)}
}

let _dvClickHandler=null

    clearTimeout(window._dvTimer)

        const sheet=document.getElementById('deviceSheet'),chip=document.getElementById('hdevchip')
        if(!sheet.contains(e.target)&&!chip.contains(e.target)) closeDeviceSheet()
      }

  }

function closeDeviceSheet(){
  document.getElementById('deviceSheet').classList.remove('open')
  document.getElementById('deviceSheetOv').classList.remove('open')
  if(_dvClickHandler){document.removeEventListener('click',_dvClickHandler);_dvClickHandler=null}

async function loadDevices(){
  try{
    const r=await fetch(`${SERVER}/api/devices`,{headers:hdrs()})
    if(r.ok){const j=await r.json();devices=Array.isArray(j)?j:(j.data||[])}
    else throw new Error()
  }catch{
    // Fallback: derive devices from already-loaded notification data
    const map=new Map()
    for(const n of notifs){
      if(!n.device_id) continue
      if(!map.has(n.device_id))map.set(n.device_id,{id:n.device_id,name:n.device_name||n.device_id,last_seen:n.received_at||n.posted_at,notification_count:0})
      map.get(n.device_id).notification_count++
      const ls=n.received_at||n.posted_at;if(ls>map.get(n.device_id).last_seen)map.get(n.device_id).last_seen=ls
    }
    devices=[...map.values()]
  }

  // Update header chip with device name now that we have the list
  updateDeviceChip()

  // Auto-prompt if multiple devices and no default set
  if(devices.length>1&&!defaultDevice&&!localStorage.getItem('nh-device-seen')){
    try{localStorage.setItem('nh-device-seen','1')}catch{}
    openDeviceSheet()
  }

  renderDeviceList()
}

function updateDeviceChip(){
  const chip=document.getElementById('hdevchip'),name=document.getElementById('hdevname')
  if(!name) return
  if(deviceFilter===null){name.textContent='All devices';chip?.classList.remove('filtered')}
  else{const d=devices.find(x=>x.id===deviceFilter);const nick=getNick(deviceFilter);name.textContent=nick||(d?(d.name||d.id):deviceFilter);chip?.classList.add('filtered')}
}

  const totalItems=notifs.length
  const isAll=deviceFilter===null
  const isAllDef=defaultDevice===null

  let html=`<div class="dv-sec">
    <div class="dv-stitle">View</div>
    <div class="dv-item${isAll?' on':''}" data-dvid="" onclick="if(!event.target.closest('button'))setDevice(null)">
      <div class="dv-ico">✦</div>
      <div class="dv-info">
        <span class="dv-name">All devices (Central)</span>
        <span class="dv-meta">${devices.length} device${devices.length!==1?'s':''} · ${totalItems} items</span>
      </div>
      <div class="dv-acts">
        <button class="dv-star${isAllDef?' on':''}" onclick="setDefaultDevice(null)" title="${isAllDef?'Default':'Set as default'}">★</button>
      </div>
    </div>
  </div>`

  if(devices.length){
    html+=`<div class="dv-sec"><div class="dv-stitle">Devices</div>`
    for(const d of devices){
      const isOn=deviceFilter===d.id,isDef=defaultDevice===d.id
      const cnt=d.notification_count||0,ls=d.last_seen?`Last seen ${relTime(d.last_seen)} · `:''
      const nick=getNick(d.id),displayName=esc(nick||d.name||d.id)
      html+=`<div class="dv-item${isOn?' on':''}" data-dvid="${esc(d.id)}" onclick="if(!event.target.closest('button'))setDevice(this.dataset.dvid)">
        <div class="dv-ico">📱</div>
        <div class="dv-info">
          <span class="dv-name">${displayName}</span>
          <span class="dv-meta">${ls}${cnt} items</span>
        </div>
        <div class="dv-acts">
          <button class="dv-edit" onclick="editNick(this.closest('[data-dvid]').dataset.dvid)" title="Rename">✎</button>
          <button class="dv-star${isDef?' on':''}" onclick="setDefaultDevice(this.closest('[data-dvid]').dataset.dvid)" title="${isDef?'Default':'Set as default'}">★</button>
          <button class="dv-del" onclick="dvDelete(this.closest('[data-dvid]').dataset.dvid)" title="Delete device">${ICO_TRASH_SML}</button>
        </div>
      </div>`
    }
    html+=`</div>`
  } else {
    html+=`<div class="dv-empty">No individual devices found.<br>Notifications don't include a device ID yet.</div>`
  }

  el.innerHTML=html

function setDevice(id){
  deviceFilter=id
  updateDeviceChip()
  renderDeviceList()
  closeDeviceSheet()
  load(true)
}

function setDefaultDevice(id){
  defaultDevice=id
  try{if(id===null)localStorage.removeItem('nh-device');else localStorage.setItem('nh-device',id)}catch{}
  renderDeviceList()

async function deleteDevice(id){
  try{
    const r=await fetch(`${SERVER}/api/devices/${encodeURIComponent(id)}`,{method:'DELETE',headers:hdrs()})
    if(!r.ok) throw new Error(await r.text())
    if(deviceFilter===id) setDevice(null)
    else if(defaultDevice===id){setDefaultDevice(null);renderDeviceList()}
    devices=devices.filter(d=>d.id!==id)
    renderDeviceList()

  }catch(e){dvToast(`Delete failed: ${e.message||'server error'}`)}

  t.textContent=msg;t.style.opacity='1'

// ── Swipe to delete ───────────────────────────
const ICO_SWIPE_DEL=`<svg width="22" height="22" viewBox="0 0 16 16" fill="white"><path d="M6.5 1a.5.5 0 00-.5.5V2H3.5a.5.5 0 000 1h.6l.7 10.2a1 1 0 001 .8h4.4a1 1 0 001-.8L12.9 3h.6a.5.5 0 000-1H10V1.5a.5.5 0 00-.5-.5h-3zM5.13 3h5.74l-.68 9.7a.1.1 0 01-.1.08H5.91a.1.1 0 01-.1-.08L5.13 3z"/></svg>`
function initSwipeHandlers(){
  const feed=document.getElementById('feed')
  if(!feed) return
  feed.querySelectorAll('.cr:not([data-sw])').forEach(row=>{
    row.dataset.sw='1'
    const inner=row.querySelector('.cr-inner')
    if(!inner) return
    // Append red delete strip
    const bg=document.createElement('div')
    bg.className='swipe-del';bg.innerHTML=ICO_SWIPE_DEL
    bg.addEventListener('click',e=>{
      e.stopPropagation()
      const uid=row.dataset.id
      const n=notifs.find(x=>x._uid===uid)
      if(n){if(n._kind==='t')doDeleteText(uid);else doArchive(uid)}
    })
    row.appendChild(bg)
    // Touch state
    let sx=0,sy=0,dx=0,swiping=false,snapped=false
    row.addEventListener('touchstart',e=>{
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;swiping=false
      inner.style.transition='none'
    },{passive:true})
    row.addEventListener('touchmove',e=>{
      const cx=e.touches[0].clientX,cy=e.touches[0].clientY
      dx=sx-cx
      if(!swiping){
        if(Math.abs(cy-sy)>Math.abs(dx))return // vertical scroll
        if(dx<2)return
        swiping=true
      }
      if(dx<0){inner.style.transform='';return}
      e.preventDefault()
      inner.style.transform=`translateX(-${Math.min(dx,76)}px)`
    },{passive:false})
    row.addEventListener('touchend',()=>{
      inner.style.transition='transform .22s cubic-bezier(.4,0,.2,1)'
      if(dx>60){inner.style.transform='translateX(-72px)';snapped=true}
      else{inner.style.transform='';snapped=false}
      dx=0;swiping=false
    })
  })
  // Tap elsewhere to close any snapped row
  feed.addEventListener('touchstart',e=>{
    if(e.target.closest('.swipe-del')) return
    feed.querySelectorAll('.cr[data-sw]').forEach(r=>{
      const inn=r.querySelector('.cr-inner')
      if(inn&&inn.style.transform){inn.style.transition='transform .22s cubic-bezier(.4,0,.2,1)';inn.style.transform=''}
    })
  },{passive:true})
}

// ── Gallery ───────────────────────────────────
let galImages=[],galSelected=new Set()
async function openGallery(){
  document.getElementById('gallery').hidden=false
  galImages=[];galSelected.clear()
  const sc=document.getElementById('galScroll')
  sc.className='gal-loading';sc.innerHTML='<div class="tl-spin"></div><span>Loading…</span>'
  document.getElementById('galDelbtn').disabled=true
  document.getElementById('galSelbtn').textContent='All'
  try{
    const r=await fetch(`${SERVER}/api/notifications?limit=200&page=1`,{headers:hdrs()})
    const j=await r.json()
    galImages=(j.data||[]).filter(n=>n.image_url).map(normNotif)
    renderGallery()
  }catch{sc.className='gal-empty';sc.textContent='Failed to load images'}
}
function closeGallery(){document.getElementById('gallery').hidden=true;galImages=[];galSelected.clear()}
function renderGallery(){
  const sc=document.getElementById('galScroll')
  if(!galImages.length){sc.className='gal-empty';sc.innerHTML='No images found';return}
  sc.className='galscroll'
  sc.innerHTML=galImages.map(n=>{
    const app=esc(n.app_label||n.package_name.split('.').pop())
    const src=esc(imgUrl(n.image_url))
    const sel=galSelected.has(n._uid)
    return`<div class="galthumb${sel?' on':''}" data-uid="${n._uid}" onclick="toggleGalSel('${n._uid}')" ondblclick="openGalview('${esc(src)}')">
      <img src="${src}" loading="lazy" alt="">
      <span class="galapp">${app}</span>
      <div class="galchk"><svg width="20" height="20" viewBox="0 0 16 16" fill="white"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg></div>
    </div>`
  }).join('')
}
function toggleGalSel(uid){
  galSelected.has(uid)?galSelected.delete(uid):galSelected.add(uid)
  document.querySelector(`.galthumb[data-uid="${uid}"]`)?.classList.toggle('on',galSelected.has(uid))
  document.getElementById('galDelbtn').disabled=galSelected.size===0
  document.getElementById('galSelbtn').textContent=galImages.every(n=>galSelected.has(n._uid))?'None':'All'
}
function toggleGalAll(){
  const allSel=galImages.every(n=>galSelected.has(n._uid))
  if(allSel)galSelected.clear();else galImages.forEach(n=>galSelected.add(n._uid))
  renderGallery()
  document.getElementById('galDelbtn').disabled=galSelected.size===0
  document.getElementById('galSelbtn').textContent=allSel?'All':'None'
}
async function deleteGalSelected(){
  if(!galSelected.size)return
  const cnt=galSelected.size
  if(!confirm(`Delete ${cnt} notification${cnt>1?'s':''} with image${cnt>1?'s':''}? This cannot be undone.`))return
  const ids=[...galSelected].map(uid=>{const n=galImages.find(x=>x._uid===uid);return n?.id}).filter(Boolean)
  try{
    await fetch(`${SERVER}/api/notifications`,{method:'DELETE',headers:hdrs(),body:JSON.stringify({ids})})
    galImages=galImages.filter(n=>!galSelected.has(n._uid))
    for(const id of ids){const idx=notifs.findIndex(n=>n.id===id);if(idx!==-1)notifs.splice(idx,1)}
    galSelected.clear()
    renderGallery();renderAppLists()
    document.getElementById('galDelbtn').disabled=true
  }catch{alert('Delete failed')}
}
function openGalview(src){document.getElementById('galviewImg').src=src;document.getElementById('galview').hidden=false}
function closeGalview(){document.getElementById('galview').hidden=true;document.getElementById('galviewImg').src=''}

function applyTheme(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeColorMeta')?.setAttribute('content',t==='dark'?'#111111':'#f5f5f7');try{localStorage.setItem('nh-theme',t)}catch{}}
applyTheme(theme)
document.getElementById('themeBtn').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';applyTheme(theme)})

document.getElementById('app').hidden=false
updateDeviceChip() // set header chip before first load (device restored from localStorage)

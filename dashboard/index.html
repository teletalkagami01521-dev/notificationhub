<title>NotifyHub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" id="themeColorMeta" content="#242526">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NotifyHub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<style>
/* ── Tokens ───────────────────────────────────────── */
:root {
  --bg:#ffffff; --surf:#f0f2f5; --surf2:#e4e6eb; --bord:#e4e6eb;
  --fg:#050505; --muted:#65676b; --subtle:#ccd0d5;
  --accent:#0084ff; --abg:rgba(0,132,255,.1);
  --danger:#fa3e3e; --live:#31a24c; --warn:#f59e0b;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1e21; --surf:#242526; --surf2:#3a3b3c; --bord:#3a3b3c;
    --fg:#e4e6eb; --muted:#b0b3b8; --subtle:#4e4f50;
    --accent:#0084ff; --abg:rgba(0,132,255,.15);
    --danger:#fa3e3e; --live:#31a24c; --warn:#f59e0b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1e21; --surf:#242526; --surf2:#3a3b3c; --bord:#3a3b3c;
  --fg:#e4e6eb; --muted:#b0b3b8; --subtle:#4e4f50;
  --accent:#0084ff; --abg:rgba(0,132,255,.15);
  --danger:#fa3e3e; --live:#31a24c;
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}

/* ── Reset ───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;
  background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{display:block}

/* ── Shell ───────────────────────────────────────── */
.shell{display:flex;flex-direction:column;height:100%;max-width:680px;margin:0 auto;position:relative}

/* ── Header ──────────────────────────────────────── */
header{
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
  min-height:calc(56px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:8px;
  background:var(--bg);border-bottom:1px solid var(--bord);
  position:sticky;top:0;z-index:20;flex-shrink:0;
}
.htitle{font-size:22px;font-weight:800;flex:1;letter-spacing:-.5px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--warn);transition:background .4s;flex-shrink:0;margin-left:1px}
.sdot.live{background:var(--live)}
.hbtns{display:flex;gap:2px}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);transition:background .12s,color .12s;flex-shrink:0}
.ib:hover{background:var(--surf2)}
.ib.on{color:var(--accent)}

/* ── Search ──────────────────────────────────────── */
.sbar{
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:var(--bg);border-bottom:1px solid var(--bord);flex-shrink:0;
}
.sbar[hidden]{display:none}
.swrap{position:relative}
.swrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#si{width:100%;padding:9px 14px 9px 36px;background:var(--surf);border:none;
  border-radius:50px;color:var(--fg);font-size:14px;font-family:inherit;outline:none}
#si::placeholder{color:var(--muted)}

/* ── Chips ───────────────────────────────────────── */
.chips{overflow-x:auto;scrollbar-width:none;background:var(--bg);flex-shrink:0;border-bottom:1px solid var(--bord)}
.chips::-webkit-scrollbar{display:none}
.chips-row{display:flex;gap:6px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  width:max-content;min-width:100%}
.chip{padding:6px 14px;border-radius:50px;font-size:13px;font-weight:500;
  background:var(--surf);color:var(--muted);white-space:nowrap;transition:all .15s}
.chip:hover{background:var(--surf2)}
.chip.on{background:var(--accent);color:#fff;font-weight:600}

/* ── New banner ──────────────────────────────────── */
.nb{background:var(--accent);color:#fff;font-size:13px;font-weight:600;
  text-align:center;padding:9px;cursor:pointer;flex-shrink:0}
.nb[hidden]{display:none}

/* ── Feed ────────────────────────────────────────── */
#feed{flex:1;overflow-y:auto;overflow-x:hidden}

/* ── Day separator ───────────────────────────────── */
.dsep{
  display:flex;align-items:center;gap:10px;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);cursor:pointer;user-select:none;
}
.dsep::before,.dsep::after{content:'';flex:1;height:1px;background:var(--bord)}
.dsep-chev{transition:transform .18s;flex-shrink:0}
.dsep.col .dsep-chev{transform:rotate(-90deg)}
.ditems[hidden]{display:none!important}

/* ── Conversation row ────────────────────────────── */
.cr{
  display:flex;align-items:center;gap:12px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  transition:background .1s;cursor:default;
}
@media(hover:hover){.cr:hover{background:var(--surf)}}
.cr:active{background:var(--surf2)}
#feed.sel .cr{cursor:pointer}
#feed.sel .cr.selected{background:var(--abg)}
#feed:not(.sel) .cck{display:none!important}
.cr.incoming{animation:slideIn .22s ease-out}
.cr.out{animation:slideOut .18s ease-in forwards;overflow:hidden;pointer-events:none}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(32px);max-height:0;padding:0}}
@media(prefers-reduced-motion:reduce){.cr.incoming,.cr.out{animation:none}}

/* ── Avatar ──────────────────────────────────────── */
.cav{
  width:56px;height:56px;border-radius:50%;
  position:relative;flex-shrink:0;overflow:visible;
  display:grid;place-items:center;
}
.cav-inner{
  width:56px;height:56px;border-radius:50%;overflow:hidden;
  position:relative;display:grid;place-items:center;
}
.cai{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .25s;border-radius:50%}
.cav-inner.iv .cai{opacity:1}
.cav-inner.iv .cal{opacity:0}
.cal{font-size:21px;font-weight:700;color:#fff;position:relative;z-index:1;
  pointer-events:none;user-select:none;transition:opacity .2s;line-height:1}
/* Unread dot on avatar bottom-right */
.udot{
  position:absolute;bottom:0;right:0;
  width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:3px solid var(--bg);
  display:none;z-index:4;
}
.cr.unread .udot{display:block}
/* Select check */
.cck{
  position:absolute;inset:0;border-radius:50%;
  background:var(--accent);display:grid;place-items:center;z-index:5;
  opacity:0;transition:opacity .15s;
}
.cr.selected .cck{opacity:1}

/* ── Row content ─────────────────────────────────── */
.cmeta{flex:1;min-width:0}
.ctop{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.cname{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cr.unread .cname{font-weight:700}
.ctime{font-size:12px;color:var(--muted);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.cr.unread .ctime{color:var(--accent);font-weight:600}
.cbot{display:flex;align-items:center;gap:6px}
.cmsg{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cr.unread .cmsg{color:var(--fg);font-weight:500}
.cudot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0;display:none}
.cr.unread .cudot{display:block}

/* Quick actions */
.cacts{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .15s}
@media(hover:hover){.cr:hover .cacts{opacity:1}}
@media(hover:none){.cacts{opacity:1}}
#feed.sel .cacts{display:none!important}
.ca{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);transition:background .1s,color .1s}
.ca:hover{background:var(--surf2);color:var(--fg)}
.ca.del:hover{color:var(--danger)}

/* ── Skeleton ─────────────────────────────────────── */
.skelwrap{padding:8px 0}
.skelrow{display:flex;align-items:center;gap:12px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.skelav{width:56px;height:56px;border-radius:50%;background:var(--surf);animation:blink 1.6s infinite;flex-shrink:0}
.skelbody{flex:1;display:flex;flex-direction:column;gap:7px}
.skelln{height:14px;border-radius:7px;background:var(--surf);animation:blink 1.6s infinite}
.skelln.w80{width:80%}.skelln.w55{width:55%}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:.8}}

/* ── Empty ────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;padding:72px 24px;
  text-align:center;color:var(--muted);gap:10px}
.empty svg{opacity:.2}

/* ── Load more ────────────────────────────────────── */
.lmwrap{padding:8px 16px 32px}
.lmbtn{width:100%;padding:11px;background:none;border:1px solid var(--bord);
  border-radius:10px;color:var(--muted);font-size:13px;font-family:inherit;transition:background .12s}
.lmbtn:hover{background:var(--surf)}
.lmbtn:disabled{opacity:.4;cursor:default}

/* ── Select bar ───────────────────────────────────── */
.selbar{
  position:fixed;bottom:0;
  left:50%;transform:translateX(-50%) translateY(110%);
  width:100%;max-width:680px;
  background:var(--bg);border-top:1px solid var(--bord);
  display:flex;align-items:center;gap:8px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,10px)) max(16px,env(safe-area-inset-left,0px));
  z-index:30;transition:transform .22s cubic-bezier(.4,0,.2,1);
}
.selbar.show{transform:translateX(-50%) translateY(0)}
.sbc{padding:9px 16px;border-radius:50px;background:var(--surf);color:var(--muted);font-size:14px;font-weight:500}
.sbi{flex:1;font-size:13px;color:var(--muted);text-align:center}
.sball{padding:9px 16px;border-radius:50px;color:var(--accent);font-size:14px;font-weight:600}
.sbdel{padding:9px 20px;border-radius:50px;background:var(--accent);color:#fff;font-size:14px;font-weight:600}
.sbdel:disabled{opacity:.38;cursor:default}

/* ── Drawer overlay ───────────────────────────────── */
.drov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:59;display:none;backdrop-filter:blur(2px)}
.drov.open{display:block}

/* ── Filter drawer ────────────────────────────────── */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(300px,86vw);
  background:var(--bg);border-left:1px solid var(--bord);
  transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  z-index:60;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
.drawer.open{transform:translateX(0)}
.drhead{display:flex;align-items:center;padding:14px 14px 14px 16px;border-bottom:1px solid var(--bord);flex-shrink:0}
.drtitle{font-size:16px;font-weight:700;flex:1}
.drbody{overflow-y:auto;flex:1;padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
.drsec{padding:14px 16px;border-bottom:1px solid var(--bord)}
.drstitle{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.drtgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dtb{padding:9px 10px;border-radius:12px;border:1.5px solid var(--bord);color:var(--muted);
  font-size:13px;font-weight:500;text-align:left;transition:all .15s}
.dtb:hover{background:var(--surf)}
.dtb.on{background:var(--abg);border-color:var(--accent);color:var(--accent);font-weight:600}
.dapp{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;
  cursor:pointer;transition:background .12s;border:1.5px solid transparent;margin-bottom:3px}
.dapp:hover{background:var(--surf)}
.dapp.on{background:var(--abg);border-color:var(--accent)}
.dav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#fff;flex-shrink:0;position:relative;overflow:hidden}
.dav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.dav.iv img{opacity:1}
.dav.iv span{opacity:0}
.dav span{transition:opacity .2s;position:relative;z-index:1}
.davn{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.davb{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:50px;
  padding:1px 7px;min-width:20px;text-align:center}
.davb:empty{display:none}

/* ── Modal ────────────────────────────────────────── */
.mlov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;
  z-index:80;padding:24px;backdrop-filter:blur(4px)}
.mlov[hidden]{display:none!important}
.mlbox{background:var(--bg);border:1px solid var(--bord);border-radius:20px;
  padding:28px 22px 22px;max-width:280px;width:100%;text-align:center;animation:popIn .18s ease-out}
@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.mlico{font-size:36px;margin-bottom:12px}
.mlh{font-size:17px;font-weight:700;margin-bottom:6px}
.mls{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.5}
.mlbtns{display:flex;gap:9px}
.mlcan{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;
  background:var(--surf);color:var(--fg);border:1px solid var(--bord)}
.mlcon{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;
  background:var(--accent);color:#fff;border:none}
</style>

<div class="drov" id="drov" onclick="closeDrawer()"></div>

<div class="drawer" id="drawer">
  <div class="drhead">
    <span class="drtitle">Filters</span>
    <button class="ib" onclick="closeDrawer()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"/></svg>
    </button>
  </div>
  <div class="drbody">
    <div class="drsec">
      <div class="drstitle">Time Range</div>
      <div class="drtgrid">
        <button class="dtb on" data-t="all"     onclick="setTime('all')">All time</button>
        <button class="dtb"    data-t="1h"      onclick="setTime('1h')">Last hour</button>
        <button class="dtb"    data-t="2h"      onclick="setTime('2h')">Last 2 h</button>
        <button class="dtb"    data-t="6h"      onclick="setTime('6h')">Last 6 h</button>
        <button class="dtb"    data-t="12h"     onclick="setTime('12h')">Last 12 h</button>
        <button class="dtb"    data-t="today"   onclick="setTime('today')">Today</button>
        <button class="dtb"    data-t="earlier" onclick="setTime('earlier')" style="grid-column:1/-1">Earlier days</button>
      </div>
    </div>
    <div class="drsec">
      <div class="drstitle">Apps</div>
      <div id="drawerApps"></div>
    </div>
  </div>
</div>

<div class="mlov" id="modal" hidden>
  <div class="mlbox">
    <div class="mlico">🗑️</div>
    <div class="mlh">Delete <span id="mlcnt">0</span>?</div>
    <div class="mls">This action cannot be undone.</div>
    <div class="mlbtns">
      <button class="mlcan" onclick="closeModal()">Cancel</button>
      <button class="mlcon" onclick="execDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="shell" id="app" hidden>
  <header>
    <span class="htitle">NotifyHub</span>
    <span class="sdot" id="sdot"></span>
    <div class="hbtns">
      <button class="ib" id="searchBtn" onclick="toggleSearch()" title="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="ib" id="refreshBtn" onclick="doRefresh()" title="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button class="ib" id="selectBtn" onclick="toggleSel()" title="Select">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/></svg>
      </button>
      <button class="ib" id="filterBtn" onclick="openDrawer()" title="Filters">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      </button>
      <button class="ib" id="themeBtn" title="Toggle theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="sbar" id="sbar" hidden>
    <div class="swrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="si" placeholder="Search notifications…" autocomplete="off">
    </div>
  </div>

  <div class="chips">
    <div class="chips-row">
      <button class="chip on" data-t="all"     onclick="setTime('all')">All</button>
      <button class="chip"    data-t="1h"      onclick="setTime('1h')">1h</button>
      <button class="chip"    data-t="2h"      onclick="setTime('2h')">2h</button>
      <button class="chip"    data-t="6h"      onclick="setTime('6h')">6h</button>
      <button class="chip"    data-t="12h"     onclick="setTime('12h')">12h</button>
      <button class="chip"    data-t="today"   onclick="setTime('today')">Today</button>
      <button class="chip"    data-t="earlier" onclick="setTime('earlier')">Earlier</button>
    </div>
  </div>

  <div class="nb" id="nb" hidden></div>

  <div id="feed">
    <div class="skelwrap">
      <div class="skelrow"><div class="skelav"></div><div class="skelbody"><div class="skelln w80"></div><div class="skelln w55"></div></div></div>
      <div class="skelrow"><div class="skelav"></div><div class="skelbody"><div class="skelln w80"></div><div class="skelln w55"></div></div></div>
      <div class="skelrow"><div class="skelav"></div><div class="skelbody"><div class="skelln w80"></div><div class="skelln w55"></div></div></div>
      <div class="skelrow"><div class="skelav"></div><div class="skelbody"><div class="skelln w80"></div><div class="skelln w55"></div></div></div>
    </div>
  </div>
</div>

<div class="selbar" id="selbar">
  <button class="sbc" onclick="toggleSel()">Cancel</button>
  <span class="sbi" id="selinfo">Select items</span>
  <button class="sball" id="selall" onclick="toggleSelAll()">All</button>
  <button class="sbdel" id="seldel" onclick="showModal()" disabled>Delete</button>
</div>

<script>
const SERVER = 'https://notificationhub-10g2.onrender.com'
const token  = 'solaimankabiranik'
const hdrs   = () => ({'Authorization':`Bearer ${token}`,'Content-Type':'application/json'})

fetch(`${SERVER}/health`,{cache:'no-store'}).catch(()=>{})
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{})

// ── Domain map ───────────────────────────────────────
const DOMAIN_MAP = {
  'com.google.android.gm':'gmail.com',
  'com.google.android.youtube':'youtube.com',
  'com.google.android.apps.messaging':'messages.google.com',

function iconSrcs(pkg){
  let domain = DOMAIN_MAP[pkg]
  if(!domain){
    const p=pkg.split('.')
    if(p.length>=2&&['com','org','net','io','app','co'].includes(p[0]))
      domain=p[1]+'.com'
    else return []
  }
  const base=domain.split('/')[0]
  return [`https://logo.clearbit.com/${base}`,`https://www.google.com/s2/favicons?domain=${domain}&sz=128`]
}

function tryNextIcon(el){
  try{
    const srcs=JSON.parse(el.dataset.srcs||'[]')
    const si=parseInt(el.dataset.si||'0')+1
    el.dataset.si=si
    if(si>=srcs.length) return
    const img=el.querySelector('.cai'); if(img) img.src=srcs[si]
  }catch{}
}

// ── Helpers ──────────────────────────────────────────
const PAL=['#1877f2','#e91e63','#9c27b0','#00897b','#e65100','#1565c0','#2e7d32','#6a1b9a','#c62828','#37474f']
function appColor(p){let h=0;for(let i=0;i<p.length;i++)h=((h<<5)-h+p.charCodeAt(i))|0;return PAL[Math.abs(h)%PAL.length]}
function appInit(l){return(l||'?').trim()[0].toUpperCase()}
function relTime(iso){
  const s=Math.floor((Date.now()-new Date(iso))/1000)
  if(s<60) return 'now';if(s<3600) return Math.floor(s/60)+'m'
  if(s<86400) return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ── State ────────────────────────────────────────────
let notifs=[],appFilter=null,searchQ='',timeFilter='all'
let page=1,totalCount=0,hasMore=false,newPending=0
let appCounts={},selectMode=false,selectedIds=new Set()
let currentGroups=[],userToggledDays=new Set()

// ── Filters ──────────────────────────────────────────
function setTime(t){
  timeFilter=t
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))
  renderFeed()
}
function filteredNotifs(){
  const now=Date.now(),todayMs=new Date().setHours(0,0,0,0)
  return notifs.filter(n=>{
    if(appFilter&&n.package_name!==appFilter) return false
    if(searchQ){const q=searchQ.toLowerCase();
      if(!(n.title||'').toLowerCase().includes(q)&&!(n.text_body||'').toLowerCase().includes(q)&&
         !(n.app_label||'').toLowerCase().includes(q)) return false}
    const t=new Date(n.received_at||n.posted_at).getTime()
    if(timeFilter==='today') return t>=todayMs
    if(timeFilter==='earlier') return t<todayMs
    const h=parseInt(timeFilter);if(!isNaN(h)) return now-t<=h*3600000
    return true
  })
}

// ── Day grouping ─────────────────────────────────────
function groupByDay(list){
  const map=new Map(),now=new Date()
  const tod=new Date(now);tod.setHours(0,0,0,0)
  const yes=new Date(tod);yes.setDate(yes.getDate()-1)
  for(const n of list){
    const d=new Date(n.received_at||n.posted_at),ds=new Date(d);ds.setHours(0,0,0,0)
    const tk=ds.getTime()
    const lbl=tk===tod.getTime()?'Today':tk===yes.getTime()?'Yesterday':
      d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})
    if(!map.has(lbl)) map.set(lbl,{lbl,tk,items:[]})
    map.get(lbl).items.push(n)
  }
  return [...map.values()].sort((a,b)=>b.tk-a.tk)
}
function isDayCol(lbl){const def=lbl!=='Today'&&lbl!=='Yesterday';return userToggledDays.has(lbl)?!def:def}
function toggleDay(idx){
  const g=currentGroups[idx];if(!g) return
  userToggledDays.has(g.lbl)?userToggledDays.delete(g.lbl):userToggledDays.add(g.lbl)
  const hdr=document.querySelector(`.dsep[data-i="${idx}"]`)
  const items=document.querySelector(`.ditems[data-i="${idx}"]`)
  if(!hdr||!items) return
  const col=isDayCol(g.lbl)
  hdr.classList.toggle('col',col);items.hidden=col
}

// ── Build row ─────────────────────────────────────────
const CHK=`<svg width="16" height="16" viewBox="0 0 16 16" fill="white"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg>`

function buildRow(n){
  const sel=selectedIds.has(n.id)
  const app=esc(n.app_label||n.package_name.split('.').pop())
  const preview=esc(n.title&&n.text_body?`${n.title}: ${n.text_body}`:(n.title||n.text_body||'No preview'))
  const srcs=iconSrcs(n.package_name)
  const color=appColor(n.package_name)
  const letter=appInit(n.app_label||n.package_name)
  const enc=srcs.length?` data-srcs="${esc(JSON.stringify(srcs))}" data-si="0"`:''
  const imgHtml=srcs.length?`<img class="cai" src="${esc(srcs[0])}" loading="lazy"
    onload="this.parentElement.classList.add('iv')" onerror="tryNextIcon(this.parentElement)" alt="">`:''
  return `<div class="cr${!n.is_read?' unread':''}${sel?' selected':''}" data-id="${n.id}" onclick="onRowClick(${n.id})">
    <div class="cav">
      <div class="cav-inner" style="background:${color}"${enc}>
        ${imgHtml}
        <span class="cal">${letter}</span>
      </div>
      <div class="udot"></div>
      <div class="cck">${CHK}</div>
    </div>
    <div class="cmeta">
      <div class="ctop">
        <span class="cname">${app}</span>
        <span class="ctime" data-ts="${esc(n.received_at||n.posted_at)}">${relTime(n.received_at||n.posted_at)}</span>
      </div>
      <div class="cbot">
        <span class="cmsg">${preview}</span>
        <span class="cudot"></span>
      </div>
    </div>
    <div class="cacts">
      ${!n.is_read?`<button class="ca" title="Mark read" onclick="event.stopPropagation();doRead(${n.id},this)">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg>
      </button>`:''}
      <button class="ca del" title="Archive" onclick="event.stopPropagation();doArchive(${n.id})">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"/></svg>
      </button>
    </div>
  </div>`
}

// ── Render ───────────────────────────────────────────
function renderFeed(){
  const feed=document.getElementById('feed'),vis=filteredNotifs()
  if(!vis.length){
    feed.innerHTML=`<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg><p>${notifs.length?'No results':'No notifications yet'}</p></div>`
    return
  }
  currentGroups=groupByDay(vis)
  const CHEV=`<svg class="dsep-chev" width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M4.427 7.427l3.396 3.396a.25.25 0 00.354 0l3.396-3.396A.25.25 0 0011.396 7H4.604a.25.25 0 00-.177.427z"/></svg>`
  let html=''
  for(let i=0;i<currentGroups.length;i++){
    const g=currentGroups[i],col=isDayCol(g.lbl)
    html+=`<div><div class="dsep${col?' col':''}" data-i="${i}" onclick="toggleDay(${i})">${esc(g.lbl)} <span style="font-weight:400;font-size:10px">${g.items.length}</span>${CHEV}</div>
    <div class="ditems" data-i="${i}"${col?' hidden':''}>${g.items.map(buildRow).join('')}</div></div>`
  }
  if(hasMore) html+=`<div class="lmwrap"><button class="lmbtn" id="lmbtn" onclick="loadMore()">Load older</button></div>`
  feed.innerHTML=html
  updateSelUI()
}

// ── Drawer apps ──────────────────────────────────────
function renderDrawerApps(){
  const apps=Object.entries(appCounts).sort((a,b)=>b[1].total-a[1].total)
  const totalUnread=apps.reduce((s,[,v])=>s+v.unread,0)
  let html=`<div class="dapp${appFilter===null?' on':''}" onclick="setApp(null)">
    <div class="dav" style="background:var(--accent)"><span>✦</span></div>
    <span class="davn">All apps</span>${totalUnread?`<span class="davb">${totalUnread}</span>`:''}
  </div>`
  for(const[pkg,c]of apps){
    const lbl=c.label||pkg.split('.').pop()
    const srcs=iconSrcs(pkg),color=appColor(pkg),letter=appInit(lbl)
    const enc=srcs.length?` data-srcs="${esc(JSON.stringify(srcs))}" data-si="0"`:''
    const imgHtml=srcs.length?`<img src="${esc(srcs[0])}" loading="lazy"
      onload="this.parentElement.classList.add('iv')" onerror="tryNextIcon(this.parentElement)" alt="">`:''
    html+=`<div class="dapp${appFilter===pkg?' on':''}" onclick="setApp(${JSON.stringify(pkg)})">
      <div class="dav" style="background:${color}"${enc}>${imgHtml}<span>${letter}</span></div>
      <span class="davn">${esc(lbl)}</span>${c.unread?`<span class="davb">${c.unread}</span>`:''}
    </div>`
  }
  document.getElementById('drawerApps').innerHTML=html
}

// ── Load ─────────────────────────────────────────────
async function load(reset=false){
  if(reset){page=1;notifs=[]}
  const p=new URLSearchParams({page,limit:50})
  if(appFilter) p.set('package',appFilter)
  if(searchQ)   p.set('search',searchQ)
  try{
    const res=await fetch(`${SERVER}/api/notifications?${p}`,{headers:hdrs()})
    if(res.status===401){location.reload();return}
    const json=await res.json(),rows=json.data||[]
    if(reset){
      notifs=rows;appCounts={}
      for(const n of rows){
        if(!appCounts[n.package_name]) appCounts[n.package_name]={total:0,unread:0,label:n.app_label}
        appCounts[n.package_name].total++;if(!n.is_read) appCounts[n.package_name].unread++
      }
    } else { notifs=[...notifs,...rows] }
    totalCount=json.pagination?.total??notifs.length;hasMore=json.pagination?.hasMore??false
    renderDrawerApps();renderFeed()
  }catch{
    document.getElementById('feed').innerHTML=`<div class="empty"><p style="color:var(--danger)">Could not load</p></div>`
  }
}
async function loadMore(){const btn=document.getElementById('lmbtn');if(btn) btn.disabled=true;page++;await load(false)}

function doRefresh(){
  const btn=document.getElementById('refreshBtn')
  btn.style.animation='spin .6s ease-in-out'
  btn.addEventListener('animationend',()=>btn.style.animation='',{once:true})
  load(true)
}

function setApp(pkg){appFilter=pkg;closeDrawer();load(true)}

  clearTimeout(searchTimer);searchQ=e.target.value.trim()

  bar.hidden=!bar.hidden;btn.classList.toggle('on',!bar.hidden)

function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('drov').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drov').classList.remove('open')}

// ── Actions ──────────────────────────────────────────
async function doRead(id,btn){
  try{
    await fetch(`${SERVER}/api/notifications/${id}/read`,{method:'PATCH',headers:hdrs()})
    const n=notifs.find(x=>x.id==id)
    if(n){n.is_read=true;if(appCounts[n.package_name]) appCounts[n.package_name].unread=Math.max(0,appCounts[n.package_name].unread-1)}
    const row=document.querySelector(`[data-id="${id}"]`)
    if(row){row.classList.remove('unread');btn?.closest('.ca')?.remove()}
    renderDrawerApps()
  }catch{}
}
async function doArchive(id){
  const row=document.querySelector(`[data-id="${id}"]`)
  if(row){row.classList.add('out');setTimeout(()=>row.remove(),190)}
  try{
    await fetch(`${SERVER}/api/notifications/${id}/archive`,{method:'PATCH',headers:hdrs()})
    const idx=notifs.findIndex(x=>x.id==id)
    if(idx!==-1){
      const n=notifs[idx]
      if(!n.is_read&&appCounts[n.package_name]) appCounts[n.package_name].unread=Math.max(0,appCounts[n.package_name].unread-1)
      if(appCounts[n.package_name]) appCounts[n.package_name].total=Math.max(0,appCounts[n.package_name].total-1)
      notifs.splice(idx,1);totalCount=Math.max(0,totalCount-1)
    }
    renderDrawerApps()
  }catch{}
}
document.getElementById('feed').addEventListener('click',()=>{document.getElementById('nb').hidden=true;newPending=0})

// ── Select mode ──────────────────────────────────────
function toggleSel(){
  selectMode=!selectMode;if(!selectMode) selectedIds.clear()
  document.getElementById('feed').classList.toggle('sel',selectMode)
  document.getElementById('selbar').classList.toggle('show',selectMode)
  document.getElementById('selectBtn').classList.toggle('on',selectMode)
  document.body.style.paddingBottom=selectMode?'70px':''
  if(!selectMode) renderFeed();else updateSelUI()
}
function onRowClick(id){
  if(!selectMode) return
  selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id)
  const row=document.querySelector(`[data-id="${id}"]`)
  if(row) row.classList.toggle('selected',selectedIds.has(id))
  updateSelUI()
}
function toggleSelAll(){
  const vis=filteredNotifs(),allSel=vis.every(n=>selectedIds.has(n.id))
  if(allSel) vis.forEach(n=>selectedIds.delete(n.id));else vis.forEach(n=>selectedIds.add(n.id))
  renderFeed()
}
function updateSelUI(){
  const n=selectedIds.size
  const info=document.getElementById('selinfo'),del=document.getElementById('seldel'),all=document.getElementById('selall')
  if(info) info.textContent=n>0?`${n} selected`:'Select items'
  if(del){del.disabled=n===0;del.textContent=n>0?`Delete ${n}`:'Delete'}
  if(all){const vis=filteredNotifs();all.textContent=(vis.length>0&&vis.every(x=>selectedIds.has(x.id)))?'None':'All'}
}

// ── Modal ─────────────────────────────────────────────
function showModal(){if(selectedIds.size===0) return;document.getElementById('mlcnt').textContent=selectedIds.size;document.getElementById('modal').hidden=false}
function closeModal(){document.getElementById('modal').hidden=true}
async function execDelete(){
  const ids=[...selectedIds];closeModal()
  ids.forEach(id=>{const r=document.querySelector(`[data-id="${id}"]`);if(r){r.classList.add('out');setTimeout(()=>r.remove(),190)}})
  try{
    await fetch(`${SERVER}/api/notifications`,{method:'DELETE',headers:hdrs(),body:JSON.stringify({ids})})
    for(const id of ids){
      const idx=notifs.findIndex(n=>n.id===id)
      if(idx!==-1){
        const n=notifs[idx]
        if(!n.is_read&&appCounts[n.package_name]) appCounts[n.package_name].unread=Math.max(0,appCounts[n.package_name].unread-1)
        if(appCounts[n.package_name]) appCounts[n.package_name].total=Math.max(0,appCounts[n.package_name].total-1)
        notifs.splice(idx,1);totalCount=Math.max(0,totalCount-1)
      }
    }
    selectedIds.clear();selectMode=false
    document.getElementById('feed').classList.remove('sel')
    document.getElementById('selbar').classList.remove('show')
    document.getElementById('selectBtn').classList.remove('on')
    document.body.style.paddingBottom=''
    renderDrawerApps();renderFeed()
  }catch{}
}

// ── SSE ──────────────────────────────────────────────
let evs=null,reconn=null
function connectSSE(){
  const dot=document.getElementById('sdot');if(evs) evs.close()
  evs=new EventSource(`${SERVER}/api/notifications/stream?token=${token}`)
  evs.addEventListener('connected',()=>{dot.className='sdot live';clearTimeout(reconn)})
  evs.addEventListener('notification',e=>{
    try{
      const n=JSON.parse(e.data);notifs.unshift(n);totalCount++
      if(!appCounts[n.package_name]) appCounts[n.package_name]={total:0,unread:0,label:n.app_label}
      appCounts[n.package_name].total++;if(!n.is_read) appCounts[n.package_name].unread++
      renderDrawerApps()
      if(appFilter&&n.package_name!==appFilter) return
      const feed=document.getElementById('feed'),nb=document.getElementById('nb')
      if(feed.scrollTop>100||selectMode||(timeFilter!=='all'&&timeFilter!=='1h'&&timeFilter!=='today')){
        newPending++;nb.hidden=false
        nb.textContent=`↑ ${newPending} new notification${newPending>1?'s':''} — tap to show`
        nb.onclick=()=>{newPending=0;nb.hidden=true;setTime('all');load(true);feed.scrollTop=0}
      } else {
        const fg=document.querySelector('.ditems[data-i="0"]')
        if(fg){const div=document.createElement('div');div.innerHTML=buildRow(n);const r=div.firstChild;r.classList.add('incoming');fg.prepend(r)}
        else renderFeed()
      }
    }catch{}
  })
  evs.onerror=()=>{dot.className='sdot';evs.close();reconn=setTimeout(connectSSE,5000)}
}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">

<style>
/* === Dark command center — light override === */
:root {
  --bg:           #0d1117;
  --surface:      #161b22;
  --surface-hi:   #1c2129;
  --border:       #21262d;
  --fg:           #e6edf3;
  --fg-muted:     #7d8590;
  --fg-subtle:    #3d444d;
  --accent:       #2f81f7;
  --accent-bg:    rgba(47,129,247,.12);
  --unread:       #f85149;
  --live:         #3fb950;
  --warn:         #d29922;
  --font-ui: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:         #f6f8fa;
    --surface:    #ffffff;
    --surface-hi: #f3f4f6;
    --border:     #d0d7de;
    --fg:         #1f2328;
    --fg-muted:   #57606a;
    --fg-subtle:  #d0d7de;
    --accent:     #0969da;
    --accent-bg:  rgba(9,105,218,.08);
    --unread:     #cf222e;
    --live:       #1a7f37;
    --warn:       #9a6700;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:         #f6f8fa;
  --surface:    #ffffff;
  --surface-hi: #f3f4f6;
  --border:     #d0d7de;
  --fg:         #1f2328;
  --fg-muted:   #57606a;
  --fg-subtle:  #d0d7de;
  --accent:     #0969da;
  --accent-bg:  rgba(9,105,218,.08);
  --unread:     #cf222e;
  --live:       #1a7f37;
  --warn:       #9a6700;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }

html, body {
  height: 100%;
  font-family: var(--font-ui);
  font-size: 14px;
  background: var(--bg);
  color: var(--fg);
}

/* ── Setup screen ── */
.setup-overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: max(16px, env(safe-area-inset-left,0px));
}
.setup-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px;
  width: 100%;
  max-width: 400px;
}
.setup-logo {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 24px;
}
.setup-logo-mark {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: grid; place-items: center;
  font-size: 16px; font-weight: 700; color: #fff;
}
.setup-logo span { font-size: 18px; font-weight: 600; }
.setup-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.setup-card p { font-size: 13px; color: var(--fg-muted); margin-bottom: 20px; line-height: 1.5; }
.setup-field { margin-bottom: 16px; }
.setup-field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; color: var(--fg-muted); }
.setup-field input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 12px;
  font-size: 13px;
  font-family: var(--font-mono);
  color: var(--fg);
  outline: none;
}
.setup-field input:focus { border-color: var(--accent); }
.setup-btn {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 7px;
  padding: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-ui);
  margin-top: 4px;
}
.setup-btn:hover { opacity: .9; }
.setup-err { font-size: 12px; color: var(--unread); margin-top: 10px; display: none; }

/* ── Layout shell ── */
.shell {
  display: grid;
  grid-template-rows: 48px 1fr;
  grid-template-columns: 220px 1fr;
  grid-template-areas:
    "header header"
    "sidebar main";
  height: 100%;
  overflow: hidden;
}
@media (max-width: 640px) {
  .shell {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "main";
  }
  .sidebar { display: none; }
}

/* ── Header ── */
header {
  grid-area: header;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
}
.logo {
  display: flex; align-items: center; gap: 8px;
  font-weight: 600; font-size: 15px; letter-spacing: -.3px;
  flex-shrink: 0;
}
.logo-mark {
  width: 22px; height: 22px;
  background: var(--accent);
  border-radius: 6px;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--warn);
  flex-shrink: 0;
  transition: background .3s;
}
.status-dot.live { background: var(--live); }
.status-label { font-size: 12px; color: var(--fg-muted); flex-shrink: 0; }

.search-wrap {
  flex: 1; max-width: 320px; margin-left: auto; position: relative;
}
.search-wrap svg {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  pointer-events: none; color: var(--fg-muted);
}
#search {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px 5px 32px;
  font-size: 13px; color: var(--fg);
  font-family: var(--font-ui); outline: none;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--fg-muted); }

.header-actions { display: flex; gap: 4px; margin-left: 8px; }
.icon-btn {
  width: 32px; height: 32px;
  border: none; background: none; cursor: pointer;
  color: var(--fg-muted); border-radius: 6px;
  display: grid; place-items: center;
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface-hi); color: var(--fg); }

/* ── Sidebar ── */
.sidebar {
  grid-area: sidebar;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto; padding: 12px 0;
}
.sidebar-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--fg-muted); padding: 0 14px 6px;
}
.app-row {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 14px; cursor: pointer;
  border-left: 2px solid transparent;
  transition: background .12s; user-select: none;
}
.app-row:hover { background: var(--surface-hi); }
.app-row.active { background: var(--accent-bg); border-left-color: var(--accent); }
.app-icon {
  width: 24px; height: 24px; border-radius: 6px;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 600; color: #fff; flex-shrink: 0;
}
.app-name { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-badge {
  font-size: 11px; font-variant-numeric: tabular-nums;
  background: var(--unread); color: #fff;
  border-radius: 10px; padding: 1px 6px;
  font-weight: 600; min-width: 20px; text-align: center;
}
.app-badge:empty { display: none; }

/* ── Main feed ── */
main { grid-area: main; overflow-y: auto; }
.feed-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px max(16px, env(safe-area-inset-left, 0px)) 10px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: var(--bg); z-index: 5;
}
.feed-title { font-size: 14px; font-weight: 600; }
.feed-count { font-size: 12px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.mark-all-btn {
  margin-left: auto; font-size: 12px; color: var(--accent);
  background: none; border: none; cursor: pointer;
  padding: 4px 8px; border-radius: 5px; font-family: var(--font-ui);
}
.mark-all-btn:hover { background: var(--accent-bg); }

#newBanner {
  display: none; position: sticky; top: 45px; z-index: 4;
  background: var(--accent); color: #fff;
  font-size: 12px; font-weight: 600;
  text-align: center; padding: 7px; cursor: pointer;
}

/* ── Cards ── */
.notif-feed {
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 4px;
}
.notif-card {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  gap: 10px; align-items: start;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: border-color .15s, opacity .2s;
  animation: slideIn .15s ease-out;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.notif-card.read { opacity: .55; }
.notif-card:hover { border-color: var(--fg-subtle); }
.card-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 600; color: #fff;
  flex-shrink: 0; margin-top: 1px;
}
.card-body { min-width: 0; }
.card-app-row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.card-app-name {
  font-size: 11px; font-weight: 600;
  color: var(--fg-muted); letter-spacing: .02em; text-transform: uppercase;
}
.card-unread-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}
.card-title {
  font-size: 13px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4;
}
.card-text {
  font-size: 13px; color: var(--fg-muted); line-height: 1.4;
  overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  word-break: break-word;
}
.card-meta {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 6px; flex-shrink: 0;
}
.card-time {
  font-size: 11px; color: var(--fg-muted);
  font-variant-numeric: tabular-nums; white-space: nowrap;
  font-family: var(--font-mono);
}
.card-actions { display: flex; gap: 2px; }
.card-btn {
  width: 24px; height: 24px;
  border: none; background: none; cursor: pointer;
  color: var(--fg-subtle); border-radius: 4px;
  display: grid; place-items: center;
  transition: background .12s, color .12s;
}
.card-btn:hover { background: var(--surface-hi); color: var(--fg-muted); }
.card-btn.archive:hover { color: var(--unread); }

.empty-state {
  padding: 60px 16px; text-align: center; color: var(--fg-muted);
}
.empty-state svg { opacity: .3; margin-bottom: 12px; }
.load-more {
  display: block; width: 100%; padding: 12px;
  background: none; border: 1px solid var(--border);
  border-radius: 8px; color: var(--fg-muted);
  font-size: 13px; cursor: pointer; font-family: var(--font-ui);
  margin: 4px 0 20px;
  transition: background .12s, color .12s;
}
.load-more:hover { background: var(--surface); color: var(--fg); }
.load-more:disabled { opacity: .4; cursor: default; }

.skeleton-card {
  height: 76px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; position: relative;
}
.skeleton-card::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, var(--surface-hi) 50%, transparent 100%);
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
@media (prefers-reduced-motion: reduce) {
  .notif-card { animation: none; }
  .skeleton-card::after { animation: none; }
}
</style>

<!-- Setup screen -->

<script>
// ── Config persisted in localStorage ──
let SERVER = '', API_KEY = ''
function loadConfig() {
  try {
    SERVER  = localStorage.getItem('nh-server') || ''
    API_KEY = localStorage.getItem('nh-key')    || ''
  } catch {}
  return !!(SERVER && API_KEY)
}
function saveConfig(url, key) {
  try {
    localStorage.setItem('nh-server', url.replace(/\/$/, ''))
    localStorage.setItem('nh-key', key)
  } catch {}
}
function clearConfig() {
  try { localStorage.removeItem('nh-server'); localStorage.removeItem('nh-key') } catch {}
}

// ── Setup screen ──
const setupOverlay = document.getElementById('setupOverlay')
const appEl        = document.getElementById('app')

document.getElementById('setupBtn').addEventListener('click', async () => {
  const url = document.getElementById('setupUrl').value.trim()
  const key = document.getElementById('setupKey').value.trim()
  const errEl = document.getElementById('setupErr')
  errEl.style.display = 'none'
  if (!url || !key) { errEl.style.display = 'block'; errEl.textContent = 'Both fields are required.'; return }

  document.getElementById('setupBtn').textContent = 'Connecting…'
  try {
    const res = await fetch(`${url.replace(/\/$/,'')}/health`)
    if (!res.ok) throw new Error()
    // Test auth
    const r2 = await fetch(`${url.replace(/\/$/,'')}/api/notifications?limit=1`, {
      headers: { 'X-API-Key': key }
    })
    if (r2.status === 401) { errEl.style.display = 'block'; errEl.textContent = 'Wrong API key.'; document.getElementById('setupBtn').textContent = 'Connect'; return }
    saveConfig(url, key)
    SERVER  = url.replace(/\/$/, '')
    API_KEY = key
    launchApp()
  } catch {
    errEl.style.display = 'block'
    errEl.textContent = 'Could not reach server. Check the URL.'
    document.getElementById('setupBtn').textContent = 'Connect'
  }
})

function launchApp() {
  setupOverlay.hidden = true
  appEl.hidden = false
  loadNotifications(true)
  connectSSE()
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  clearConfig()
  if (evtSource) evtSource.close()
  location.reload()
})

// ── State ──
const headers = () => ({ 'X-API-Key': API_KEY, 'Content-Type': 'application/json' })
let notifications = [], appFilter = null, searchQuery = ''
let page = 1, totalCount = 0, hasMore = false
let newPendingCount = 0, appCounts = {}

// ── App colors ──
const PALETTE = ['#1a7f37','#cf222e','#9a3412','#1d4ed8','#7e22ce','#0891b2','#d97706','#15803d','#b91c1c','#6d28d9']
function appColor(pkg) {
  let h = 0
  for (let i = 0; i < pkg.length; i++) h = ((h << 5) - h + pkg.charCodeAt(i)) | 0
  return PALETTE[Math.abs(h) % PALETTE.length]
}
function appInitial(label) { return (label || '?').trim()[0].toUpperCase() }

// ── Relative time ──
function relTime(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000)
  if (s < 60)    return 'just now'
  if (s < 3600)  return Math.floor(s/60) + 'm ago'
  if (s < 86400) return Math.floor(s/3600) + 'h ago'
  return Math.floor(s/86400) + 'd ago'
}

// ── Escape HTML ──
function esc(s) {
  if (!s) return ''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// ── Card HTML ──
function cardHTML(n) {
  const color = appColor(n.package_name)
  return `
    <div class="notif-card${n.is_read?' read':''}" data-id="${n.id}" data-pkg="${n.package_name}">
      <div class="card-icon" style="background:${color}">${appInitial(n.app_label||n.package_name)}</div>
      <div class="card-body">
        <div class="card-app-row">
          <span class="card-app-name">${esc(n.app_label||n.package_name.split('.').pop())}</span>
          ${!n.is_read?'<span class="card-unread-dot"></span>':''}
        </div>
        ${n.title?`<div class="card-title">${esc(n.title)}</div>`:''}
        ${n.text_body?`<div class="card-text">${esc(n.text_body)}</div>`:''}
      </div>
      <div class="card-meta">
        <span class="card-time">${relTime(n.received_at||n.posted_at)}</span>
        <div class="card-actions">
          ${!n.is_read?`<button class="card-btn" title="Mark read" onclick="markRead(${n.id},this)">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg>
          </button>`:''}
          <button class="card-btn archive" title="Archive" onclick="archiveNotif(${n.id},this)">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 2.5a.25.25 0 000 .5h12.5a.25.25 0 000-.5H1.75zM1 4.75C1 4.336 1.336 4 1.75 4h12.5c.414 0 .75.336.75.75v8c0 .414-.336.75-.75.75H1.75A.75.75 0 011 12.75v-8zm1.5.75v7h11v-7h-11zm4.25 1.5a.75.75 0 011.5 0v3.44l1.22-1.22a.75.75 0 111.06 1.06l-2.5 2.5a.75.75 0 01-1.06 0l-2.5-2.5a.75.75 0 111.06-1.06l1.22 1.22V7z"/></svg>
          </button>
        </div>
      </div>
    </div>`
}

// ── Sidebar ──
function renderSidebar() {
  const apps = Object.entries(appCounts).sort((a,b) => b[1].total - a[1].total)
  const totalUnread = apps.reduce((s,[,v]) => s + v.unread, 0)
  let html = `
    <div class="app-row${appFilter===null?' active':''}" onclick="setFilter(null)">
      <div class="app-icon" style="background:#3d444d">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="#fff"><path d="M2 2h4v4H2zm0 6h4v4H2zm6-6h4v4H8zm0 6h4v4H8z"/></svg>
      </div>
      <span class="app-name">All apps</span>
      ${totalUnread?`<span class="app-badge">${totalUnread}</span>`:''}
    </div>`
  for (const [pkg, c] of apps) {
    const label = c.label || pkg.split('.').pop()
    html += `
      <div class="app-row${appFilter===pkg?' active':''}" onclick="setFilter('${pkg}')">
        <div class="app-icon" style="background:${appColor(pkg)}">${appInitial(label)}</div>
        <span class="app-name">${esc(label)}</span>
        ${c.unread?`<span class="app-badge">${c.unread}</span>`:''}
      </div>`
  }
  document.getElementById('appList').innerHTML = html
}

// ── Feed ──
function renderFeed() {
  const feed = document.getElementById('feed')
  const visible = filteredNotifs()
  document.getElementById('feedCount').textContent = `${totalCount.toLocaleString()} total`
  if (!visible.length && !notifications.length) {
    feed.innerHTML = `<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg><p>No notifications yet</p></div>`
    return
  }
  if (!visible.length) { feed.innerHTML = `<div class="empty-state"><p>No notifications match this filter</p></div>`; return }
  let html = visible.map(n => cardHTML(n)).join('')
  if (hasMore) html += `<button class="load-more" id="loadMoreBtn" onclick="loadMore()">Load more</button>`
  feed.innerHTML = html
}

function filteredNotifs() {
  return notifications.filter(n => {
    if (appFilter && n.package_name !== appFilter) return false
    if (searchQuery) {
      const q = searchQuery.toLowerCase()
      return (n.title||'').toLowerCase().includes(q)||(n.text_body||'').toLowerCase().includes(q)||(n.app_label||'').toLowerCase().includes(q)
    }
    return true
  })
}

// ── Load ──
async function loadNotifications(reset = false) {
  if (reset) { page = 1; notifications = [] }
  const params = new URLSearchParams({ page, limit: 30 })
  if (appFilter) params.set('package', appFilter)
  if (searchQuery) params.set('search', searchQuery)
  try {
    const res  = await fetch(`${SERVER}/api/notifications?${params}`, { headers: headers() })
    const json = await res.json()
    const rows = json.data || []
    if (reset) {
      notifications = rows; appCounts = {}
      for (const n of rows) {
        if (!appCounts[n.package_name]) appCounts[n.package_name] = { total:0, unread:0, label:n.app_label }
        appCounts[n.package_name].total++
        if (!n.is_read) appCounts[n.package_name].unread++
      }
    } else { notifications = [...notifications, ...rows] }
    totalCount = json.pagination?.total ?? notifications.length
    hasMore    = json.pagination?.hasMore ?? false
    renderSidebar(); renderFeed()
  } catch {
    document.getElementById('feed').innerHTML = `<div class="empty-state"><p style="color:var(--unread)">Could not load — check server.</p></div>`
  }
}
async function loadMore() {
  const btn = document.getElementById('loadMoreBtn')
  if (btn) btn.disabled = true
  page++; await loadNotifications(false)
}

// ── Filters ──
function setFilter(pkg) {
  appFilter = pkg
  document.getElementById('feedTitle').textContent = pkg ? (appCounts[pkg]?.label || pkg.split('.').pop()) : 'All Notifications'
  page = 1; loadNotifications(true)
}
let searchTimer
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer); searchQuery = e.target.value.trim()
  searchTimer = setTimeout(() => loadNotifications(true), 350)
})

// ── Actions ──
async function markRead(id, btn) {
  try {
    await fetch(`${SERVER}/api/notifications/${id}/read`, { method:'PATCH', headers:headers() })
    const n = notifications.find(x => x.id == id)
    if (n) { n.is_read = true; if (appCounts[n.package_name]) appCounts[n.package_name].unread = Math.max(0, appCounts[n.package_name].unread-1) }
    const card = document.querySelector(`[data-id="${id}"]`)
    if (card) {
      card.classList.add('read')
      btn.closest('.card-actions').querySelector('.card-btn:not(.archive)')?.remove()
      card.querySelector('.card-unread-dot')?.remove()
    }
    renderSidebar()
  } catch {}
}
async function archiveNotif(id) {
  try {
    await fetch(`${SERVER}/api/notifications/${id}/archive`, { method:'PATCH', headers:headers() })
    const idx = notifications.findIndex(x => x.id == id)
    if (idx !== -1) {
      const n = notifications[idx]
      if (!n.is_read && appCounts[n.package_name]) appCounts[n.package_name].unread = Math.max(0, appCounts[n.package_name].unread-1)
      if (appCounts[n.package_name]) appCounts[n.package_name].total = Math.max(0, appCounts[n.package_name].total-1)
      notifications.splice(idx,1); totalCount = Math.max(0, totalCount-1)
    }
    const card = document.querySelector(`[data-id="${id}"]`)
    if (card) {
      card.style.transition = 'opacity .2s, transform .2s'
      card.style.opacity = '0'; card.style.transform = 'translateX(20px)'
      setTimeout(() => { card.remove(); renderSidebar() }, 200)
    }
  } catch {}
}
document.getElementById('markAllBtn').addEventListener('click', async () => {
  try {
    await fetch(`${SERVER}/api/notifications/mark-all-read`, { method:'PATCH', headers:headers() })
    notifications.forEach(n => n.is_read = true)
    Object.values(appCounts).forEach(c => c.unread = 0)
    renderSidebar(); renderFeed()
  } catch {}
})

// ── SSE ──
let evtSource = null, reconnectTimer = null
function connectSSE() {
  const dot = document.getElementById('statusDot')
  const lbl = document.getElementById('statusLabel')
  if (evtSource) evtSource.close()
  evtSource = new EventSource(`${SERVER}/api/notifications/stream?key=${API_KEY}`)
  evtSource.addEventListener('connected', () => { dot.className='status-dot live'; lbl.textContent='Live'; clearTimeout(reconnectTimer) })
  evtSource.addEventListener('notification', e => {
    try {
      const n = JSON.parse(e.data)
      notifications.unshift(n); totalCount++
      if (!appCounts[n.package_name]) appCounts[n.package_name] = { total:0, unread:0, label:n.app_label }
      appCounts[n.package_name].total++
      if (!n.is_read) appCounts[n.package_name].unread++
      renderSidebar()
      if (appFilter && n.package_name !== appFilter) return
      const mainEl = document.getElementById('main')
      if (mainEl.scrollTop > 200) {
        newPendingCount++
        const banner = document.getElementById('newBanner')
        banner.style.display = 'block'
        banner.textContent = `↑ ${newPendingCount} new notification${newPendingCount>1?'s':''} — click to refresh`
        banner.onclick = () => { newPendingCount=0; banner.style.display='none'; loadNotifications(true); mainEl.scrollTop=0 }
      } else {
        const feed = document.getElementById('feed')
        const tmp = document.createElement('div')
        tmp.innerHTML = cardHTML(n)
        feed.prepend(tmp.firstElementChild)
        document.getElementById('feedCount').textContent = `${totalCount.toLocaleString()} total`
      }
    } catch {}
  })
  evtSource.onerror = () => {
    dot.className='status-dot'; lbl.textContent='Reconnecting…'
    evtSource.close()
    reconnectTimer = setTimeout(connectSSE, 5000)
  }
}

// ── Theme ──
let theme = 'dark'
try { theme = localStorage.getItem('nh-theme') || 'dark' } catch {}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t)
  try { localStorage.setItem('nh-theme', t) } catch {}
}
applyTheme(theme)
document.getElementById('themeBtn').addEventListener('click', () => { theme = theme==='dark'?'light':'dark'; applyTheme(theme) })

// ── Tick relative times ──
setInterval(() => {
  const cards = document.querySelectorAll('.notif-card')
  const visible = filteredNotifs()
  cards.forEach((card, i) => {
    if (visible[i]) card.querySelector('.card-time').textContent = relTime(visible[i].received_at||visible[i].posted_at)
  })
}, 30000)

// ── Init ──
if (loadConfig()) launchApp()
</script>

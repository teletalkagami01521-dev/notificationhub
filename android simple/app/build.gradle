plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.wheelsync'
    compileSdk 34

    defaultConfig {
        applicationId "com.wheelsync"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Endpoint credentials live in gradle.properties (override there or with -P)
        buildConfigField "String", "API_KEY",
                "\"${project.findProperty('API_KEY') ?: ''}\""
        buildConfigField "String", "SERVER_URL",
                "\"${project.findProperty('SERVER_URL') ?: 'https://notificationhub-10g2.onrender.com'}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            // Signed with the standard debug key so the APK is installable for personal sideloading.
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Room (KSP — faster than KAPT on CLI builds)
    def room_version = '2.6.1'
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // WorkManager (fallback queue drain when the foreground service is killed)
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
